<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    overflow:hidden;
    background:url("https://i.ibb.co/Swd1Xpq1/background.jpg") no-repeat center/cover;
    height:100vh;
}

/* BUTTON */
#surpriseBtn{
    position:absolute;
    top:20px;
    left:20px;
    padding:10px 20px;
    font-size:18px;
    background:#ff4081;
    color:white;
    border:none;
    border-radius:10px;
}

/* GIRL */
.girl{
    width:150px;
    position:fixed;
    top:50%;
    left:-200px;
    transform:translateY(-50%);
    transition:2s;
}
.to-cake{ left:55%; }

/* PERSON */
.person{
    width:150px;
    position:fixed;
    top:50%;
    right:-200px;
    transform:translateY(-50%);
    transition:2s;
}
.person-enter{ right:30%; }

/* CAKE */
.cake-box{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:none;
}
.half{
    width:150px;
    position:absolute;
    transition:1s;
}
.left{ clip-path: inset(0 50% 0 0); }
.right{ clip-path: inset(0 0 0 50%); }
.cut-left{ transform:translateX(-40px); }
.cut-right{ transform:translateX(40px); }

/* KNIFE */
.knife{
    width:80px;
    position:fixed;
    top:50%;
    left:70%;
    display:none;
    transition:1s;
}
.hold{ left:60%; transform:rotate(-40deg); }

/* NAME */
#nameText{
    display:none;
    position:absolute;
    top:20%;
    width:100%;
    text-align:center;
    font-size:40px;
    font-weight:bold;
    animation:colorChange 1s infinite alternate;
}
@keyframes colorChange{
    0%{color:red;}
    25%{color:blue;}
    50%{color:green;}
    75%{color:orange;}
    100%{color:purple;}
}

/* BALLOONS */
.balloon{
    width:70px;
    position:absolute;
    bottom:-100px;
    animation:floatUp 6s linear infinite;
}
.b1{ left:20%; }
.b2{ left:50%; animation-delay:2s; }
.b3{ left:80%; animation-delay:4s; }

@keyframes floatUp{
    0%{ transform:translateY(0); opacity:1;}
    100%{ transform:translateY(-120vh); opacity:0;}
}

/* FIREWORKS */
#fireworks{
    display:none;
    position:fixed;
    width:100%;
    height:100%;
    background:url("https://i.ibb.co/4f3YzXG/fireworks.gif") center/cover no-repeat;
}
</style>
</head>

<body>

<button id="surpriseBtn">🎁 Surprise</button>

<h1 id="nameText">Happy Birthday Sahitya 🎉</h1>

<img src="https://i.ibb.co/6JPDVKXp/boy-standing.png" class="person" id="person">
<img src="https://i.ibb.co/6JPDVKXp/boy-standing.png" class="person" id="standing" style="display:none;">
<img src="https://i.ibb.co/qx3s2P6/girl.png" class="girl" id="girl">

<div class="cake-box" id="cakeBox">
    <img src="https://i.ibb.co/5sK7m7K/cake.png" class="half left" id="left">
    <img src="https://i.ibb.co/5sK7m7K/cake.png" class="half right" id="right">
</div>

<img src="https://i.ibb.co/QX0K7xB/knife.png" class="knife" id="knife">

<div id="balloons" style="display:none;">
    <img src="https://i.ibb.co/3y0Wz6S/balloon1.png" class="balloon b1">
    <img src="https://i.ibb.co/3y0Wz6S/balloon1.png" class="balloon b2">
    <img src="https://i.ibb.co/3y0Wz6S/balloon1.png" class="balloon b3">
</div>

<div id="fireworks"></div>

<script>
const btn = document.getElementById("surpriseBtn");
const girl = document.getElementById("girl");
const person = document.getElementById("person");
const standing = document.getElementById("standing");
const cake = document.getElementById("cakeBox");
const knife = document.getElementById("knife");

btn.onclick = () => {
    btn.style.display="none";

    girl.classList.add("to-cake");

    setTimeout(()=>{
        person.classList.add("person-enter");
    },2000);

    setTimeout(()=>{
        person.style.display="none";       // hide cake person
        standing.style.display="block";    // show normal person
        standing.classList.add("person-enter");

        cake.style.display="block";        // show cake
    },4000);

    setTimeout(()=>{
        knife.style.display="block";
        knife.classList.add("hold");
    },5000);

    setTimeout(()=>{
        document.getElementById("left").classList.add("cut-left");
        document.getElementById("right").classList.add("cut-right");
    },6000);

    setTimeout(()=>{
        document.getElementById("fireworks").style.display="block";
        document.getElementById("balloons").style.display="block";
        document.getElementById("nameText").style.display="block";
    },7000);
};
</script>

</body>
</html>
