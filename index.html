<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    padding:0;
    text-align:center;
    font-family:sans-serif;
    background:url("https://i.ibb.co/JwMLHkGT/background.jpg") no-repeat center/cover;
    height:100vh;
    overflow:hidden;
}

/* girl */
.girl{
    width:120px;
    position:fixed;
    bottom:80px;
    left:-150px;
    transition:2s;
}

/* walking */
.walk{
    left:50%;
    transform:translateX(-50%);
}

/* cake */
.cake-box{
    position:absolute;
    bottom:80px;
    left:50%;
    transform:translateX(-50%);
}

.half{
    width:200px;
    position:absolute;
    transition:1s;
}

.left{
    clip-path: inset(0 50% 0 0);
}

.right{
    clip-path: inset(0 0 0 50%);
}

.cut-left{
    transform:translateX(-40px);
}

.cut-right{
    transform:translateX(40px);
}

/* knife */
.knife{
    width:80px;
    position:fixed;
    bottom:130px;
    left:50%;
    transform:translateX(-50%) rotate(-20deg);
    display:none;
}

/* buttons */
.btns{
    position:fixed;
    bottom:10px;
    width:100%;
}

.img-btn{
    width:120px;
    margin:5px;
    cursor:pointer;
    transition:0.3s;
}

.img-btn:hover{
    transform:scale(1.1);
}

/* mobile */
@media(max-width:600px){
    .girl{width:90px;}
    .half{width:150px;}
    .img-btn{width:90px;}
}
</style>
</head>

<body>

<!-- GIRL -->
<img id="girl" class="girl" src="https://i.ibb.co/rRx3bbfZ/girl.png">

<!-- KNIFE -->
<img id="knife" class="knife" src="https://i.ibb.co/WNcGgx7j/knife.png">

<!-- CAKE -->
<div class="cake-box">
    <img id="cakeLeft" class="half left" src="https://i.ibb.co/v6QqKVRT/cake.png">
    <img id="cakeRight" class="half right" src="https://i.ibb.co/v6QqKVRT/cake.png">
</div>

<!-- BUTTONS -->
<div class="btns">

<img src="https://i.ibb.co/fz19TN1B/entry.png" class="img-btn" onclick="showGirl()">

<img src="https://i.ibb.co/kV0X2gqY/cut-cake.png" class="img-btn" onclick="cutCake()">

<img src="https://i.ibb.co/TDdCnYTj/Surprise.png" class="img-btn" onclick="goSurprise()">

</div>

<script>

/* ENTRY */
function showGirl(){
    document.getElementById("girl").classList.add("walk");
}

/* CUT CAKE */
function cutCake(){

    let girl = document.getElementById("girl");
    let knife = document.getElementById("knife");

    girl.classList.add("walk");

    setTimeout(()=>{
        knife.style.display="block";
    },1500);

    setTimeout(()=>{
        document.getElementById("cakeLeft").classList.add("cut-left");
        document.getElementById("cakeRight").classList.add("cut-right");
    },2500);

    setTimeout(()=>{
        alert("🎉 Cake Cut Successfully ❤️");
    },3500);
}

/* SURPRISE PAGE */
function goSurprise(){
    window.location.href="surprise.html";
}

</script>

</body>
</html>
