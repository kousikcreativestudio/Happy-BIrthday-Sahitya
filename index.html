<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:url("https://i.ibb.co/JwMLHkGT/background.jpg") no-repeat center/cover;
    height:100vh;
    overflow:hidden;
}

/* GIRL */
.girl{
    width:160px;
    position:fixed;
    top:50%;
    left:-200px;
    transform:translateY(-50%);
    transition:2s;
}
.to-cake{
    left:57%;
}

/* CAKE */
.cake-box{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}
.half{
    width:150px;
    position:absolute;
    transition:1s;
}
.left{ clip-path: inset(0 50% 0 0); }
.right{ clip-path: inset(0 0 0 50%); }

.cut-left{ transform:translateX(-30px); }
.cut-right{ transform:translateX(30px); }

/* KNIFE */
.knife{
    width:80px;
    position:fixed;
    top:50%;
    left:70%;
    transform:translateY(-50%);
    display:none;
    transition:1s;
}
.hold{
    left:62%;
    transform:translateY(-50%) rotate(-40deg);
}
.cut{
    transform:translateY(-20%) rotate(-40deg);
}

/* FIREWORKS */
#fireworks{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
}
.fire{
    position:absolute;
    width:140px; /* BIGGER */
    animation:boom 1.2s linear;
}
@keyframes boom{
    0%{transform:scale(0.5);opacity:1;}
    100%{transform:scale(1.8);opacity:0;}
}

/* NAME */
#name{
    position:fixed;
    top:40%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:60px;
    color:gold;
    font-weight:bold;
    letter-spacing:6px;
    display:none;

    text-shadow:
        0 0 10px #fff,
        0 0 20px pink,
        0 0 30px red,
        0 0 40px orange;

    animation:glow 1s infinite alternate;
}

@keyframes glow{
    from{
        text-shadow:
        0 0 10px #fff,
        0 0 20px pink,
        0 0 30px red;
    }
    to{
        text-shadow:
        0 0 20px #fff,
        0 0 30px yellow,
        0 0 40px orange,
        0 0 60px red;
    }
}

/* BUTTONS */
.btns{
    position:fixed;
    bottom:10px;
    width:100%;
    text-align:center;
}
.img-btn{
    width:110px;
    margin:5px;
    cursor:pointer;
}

/* MOBILE */
@media(max-width:600px){
    .girl{width:120px;}
    .half{width:120px;}
    #name{font-size:40px;}
    .img-btn{width:90px;}
}
</style>
</head>

<body>

<!-- FIREWORKS -->
<div id="fireworks"></div>

<!-- NAME -->
<h1 id="name">Sahitya</h1>

<!-- GIRL -->
<img id="girl" class="girl" src="https://i.ibb.co/rRx3bbfZ/girl.png">

<!-- KNIFE -->
<img id="knife" class="knife" src="https://i.ibb.co/WNcGgx7j/knife.png">

<!-- CAKE -->
<div class="cake-box">
    <img id="cakeLeft" class="half left" src="https://i.ibb.co/v6QqKVRT/cake.png">
    <img id="cakeRight" class="half right" src="https://i.ibb.co/v6QqKVRT/cake.png">
</div>

<!-- BUTTONS -->
<div class="btns">
    <img src="https://i.ibb.co/fz19TN1B/entry.png" onclick="showGirl()" class="img-btn">
    <img src="https://i.ibb.co/kV0X2gqY/cut-cake.png" onclick="cutCake()" class="img-btn">
    <img src="https://i.ibb.co/TDdCnYTj/Surprise.png" onclick="goSurprise()" class="img-btn">
</div>

<script>

/* ENTRY */
function showGirl(){
    document.getElementById("girl").classList.add("to-cake");
}

/* CUT CAKE */
function cutCake(){

    let girl = document.getElementById("girl");
    let knife = document.getElementById("knife");

    girl.classList.add("to-cake");

    setTimeout(()=>{
        knife.style.display="block";
    },1200);

    setTimeout(()=>{
        knife.classList.add("hold");
    },1800);

    setTimeout(()=>{
        knife.classList.add("cut");
    },2500);

    setTimeout(()=>{
        document.getElementById("cakeLeft").classList.add("cut-left");
        document.getElementById("cakeRight").classList.add("cut-right");
    },3200);

    /* SHOW NAME */
    setTimeout(()=>{
        document.getElementById("name").style.display="block";
    },3600);

    /* FIREWORKS AFTER NAME */
    setTimeout(()=>{
        startFireworks();
    },4200);
}

/* FIREWORKS LOOP */
function startFireworks(){

    let container = document.getElementById("fireworks");

    setInterval(()=>{

        let fire = document.createElement("img");
        fire.src="https://i.ibb.co/8QLGcnS/Pngtree-fireworks-for-new-years-celebration-20180243.png";
        fire.className="fire";

        fire.style.left = Math.random()*90 + "%";
        fire.style.top = Math.random()*60 + "%";

        container.appendChild(fire);

        setTimeout(()=>{
            fire.remove();
        },1200);

    },300);
}

/* SURPRISE */
function goSurprise(){
    window.location.href="surprise.html";
}

</script>

</body>
</html>
