<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    overflow:hidden;
    background:url("https://i.ibb.co/Swd1Xpq1/background.jpg") no-repeat center/cover;
    height:100vh;
}

/* GIRL */
.girl{
    width:170px;
    position:fixed;
    top:50%;
    left:-200px;
    transform:translateY(-50%);
    transition:2s;
    z-index:5;
}
.to-cake{ left:57%; }

.person{
    width:170px;
    position:fixed;
    top:50%;
    left:-200px;
    transform:translateY(-50%);
    transition:2s;
    z-index:5;
}

/* CAKE */
.cake-box{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:5;
}
.half{
    width:160px;
    position:absolute;
    transition:1s;
}
.left{ clip-path: inset(0 50% 0 0); }
.right{ clip-path: inset(0 0 0 50%); }
.cut-left{ transform:translateX(-40px); }
.cut-right{ transform:translateX(40px); }

/* KNIFE */
.knife{
    width:90px;
    position:fixed;
    top:50%;
    left:70%;
    transform:translateY(-50%);
    display:none;
    z-index:6;
}

/* FIREWORKS */
#fireworks{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:none;
    z-index:9;
}

/* BALLOONS */
#balloons{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    z-index:10;
}
.balloon{
    width:80px;
    position:absolute;
    bottom:-120px;
    animation:floatUp 7s linear infinite;
}
@keyframes floatUp{
    0%{transform:translateY(0);}
    100%{transform:translateY(-130vh);}
}

/* NAME */
#name{
    position:fixed;
    top:6%;
    left:50%;
    transform:translateX(-50%);
    font-size:50px;
    font-family:"Brush Script MT",cursive;
    display:none;
    z-index:20;

    color:#ff4dff;
    text-shadow:0 0 10px #ff4d6d,
                0 0 20px #ff1a4d,
                0 0 40px #ff1a4d;

    animation:fadeIn 2s ease forwards, glow 2s infinite alternate;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateX(-50%) scale(0.5);}
    to{opacity:1; transform:translateX(-50%) scale(1);}
}

@keyframes glow{
    0%{text-shadow:0 0 10px #ff4d6d;}
    50%{text-shadow:0 0 25px #ff1a4d;}
    100%{text-shadow:0 0 10px #ff4d6d;}
}

/* BUTTONS */
.btns{
    position:fixed;
    bottom:10px;
    width:100%;
    text-align:center;
    z-index:20;
}
.img-btn{
    width:110px;
    margin:5px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="fireworks"></div>
<h1 id="name">Happy Birthday Sahitya 🎂✨</h1>

<img id="girl" class="girl" src="https://i.ibb.co/rRx3bbfZ/girl.png">
<img id="person" class="person" src="https://i.ibb.co/YMzgYgD/boy-with-cake.png">

<img id="knife" class="knife" src="https://i.ibb.co/gZcfN3Gq/knife.png">

<div class="cake-box" id="cakeBox" style="display:none;">
    <img id="cakeLeft" class="half left" src="https://i.ibb.co/v6QqKVRT/cake.png">
    <img id="cakeRight" class="half right" src="https://i.ibb.co/v6QqKVRT/cake.png">
</div>

<div class="btns">
    <img src="https://i.ibb.co/zTSpz0pH/entry.png" onclick="showGirl()" class="img-btn">
    <img src="https://i.ibb.co/Hjg8rJ8/cut-cake.png" onclick="cutCake()" class="img-btn">
</div>

<script>

/* GIRL */
function showGirl(){
    document.getElementById("girl").classList.add("to-cake");
}

/* CUT */
function cutCake(){

    let person = document.getElementById("person");
    let knife = document.getElementById("knife");
    let cakeBox = document.getElementById("cakeBox");

    // person enters
    person.style.left = "40%";

    // show cake
    setTimeout(()=>{
        cakeBox.style.display = "block";
    },2000);

    // show knife
    setTimeout(()=>{
        knife.style.display = "block";
    },3000);

    // cut animation
    setTimeout(()=>{
        document.getElementById("cakeLeft").classList.add("cut-left");
        document.getElementById("cakeRight").classList.add("cut-right");
    },4000);

    // hide knife
    setTimeout(()=>{
        knife.style.display = "none";
    },5000);

    // 🎆 SHOW FIREWORKS + NAME
    setTimeout(()=>{
        startFireworks();
        document.getElementById("name").style.display="block";
    },5500);
}

/* FIREWORKS FUNCTION */
function startFireworks(){

    let container = document.getElementById("fireworks");
    container.style.display="block";

    setInterval(()=>{
        let fire = document.createElement("img");

        fire.src="https://i.ibb.co/4pJ4JwZ/fireworks.gif";
        fire.className="fire";

        fire.style.left = Math.random()*90 + "%";
        fire.style.top = Math.random()*80 + "%";

        container.appendChild(fire);

        setTimeout(()=>{ fire.remove(); },1500);

    },400);
}

</script>

</body>
</html>
