<script>

/* BOY (NEW) */
let boy = document.createElement("img");
boy.src = "https://i.ibb.co/6JPDVKXp/boy-with-cake.png";
boy.style.position = "fixed";
boy.style.bottom = "0";
boy.style.right = "-200px";
boy.style.width = "160px";
boy.style.transition = "2s";
boy.style.zIndex = "6";
document.body.appendChild(boy);

/* STANDING BOY */
let standBoy = document.createElement("img");
standBoy.src = "https://i.ibb.co/6JPDVKXp/boy-standing.png";
standBoy.style.position = "fixed";
standBoy.style.bottom = "0";
standBoy.style.right = "20%";
standBoy.style.width = "160px";
standBoy.style.display = "none";
standBoy.style.zIndex = "6";
document.body.appendChild(standBoy);


/* GIRL */
function showGirl(){

    document.getElementById("girl").classList.add("to-cake");

    /* BOY ENTER SIDE (FIXED POSITION) */
    setTimeout(()=>{
        boy.style.right = "35%";  // side of girl
    },1000);

    /* AFTER GIVE CAKE → SWITCH */
    setTimeout(()=>{
        boy.style.display = "none";      // hide cake boy
        standBoy.style.display = "block"; // show standing boy
    },3500);

}

/* CUT */
function cutCake(){

    let knife = document.getElementById("knife");

    document.getElementById("girl").classList.add("to-cake");

    setTimeout(()=>{ knife.style.display="block"; },1200);
    setTimeout(()=>{ knife.classList.add("hold"); },1800);

    /* MORE REAL CUT */
    setTimeout(()=>{
        knife.classList.add("cut");
    },2500);

    setTimeout(()=>{
        document.getElementById("cakeLeft").classList.add("cut-left");
        document.getElementById("cakeRight").classList.add("cut-right");
    },3000);

    setTimeout(()=>{
        knife.style.display="none"; // hide knife after cut
    },3400);

    /* FINAL CELEBRATION */
    setTimeout(()=>{
        document.getElementById("name").style.display="block";
        startColorChange();
        startFireworks();
        startBalloons();
    },3600);
}

/* FIREWORKS */
function startFireworks(){
    let container = document.getElementById("fireworks");

    setInterval(()=>{
        let fire = document.createElement("img");
        fire.src="https://i.ibb.co/8QLGcnS/Pngtree-fireworks-for-new-years-celebration-20180243.png";
        fire.className="fire";

        fire.style.left = Math.random()*95 + "%";
        fire.style.top = Math.random()*70 + "%";

        container.appendChild(fire);
        setTimeout(()=>{ fire.remove(); },1500);
    },200);
}

/* BALLOONS */
function startBalloons(){
    let container = document.getElementById("balloons");

    setInterval(()=>{
        let b = document.createElement("img");

        b.src="https://i.ibb.co/8VzV5Rv/balloon.png";

        b.className="balloon";
        b.style.left = Math.random()*90 + "%";

        b.onclick = function(e){
            createBlast(e.clientX, e.clientY);
            b.remove();
        };

        container.appendChild(b);

        setTimeout(()=>{ b.remove(); },7000);
    },700);
}

/* BLAST (FIXED URL) */
function createBlast(x,y){

    let blast = document.createElement("img");

    blast.src = "https://i.ibb.co/5Y3K8Jr/blast.png"; // ✅ FIXED

    blast.className="blast";
    blast.style.left = x + "px";
    blast.style.top = y + "px";

    document.body.appendChild(blast);

    setTimeout(()=>{ blast.remove(); },600);
}

/* NAME COLOR CHANGE */
function startColorChange(){
    let name = document.getElementById("name");

    setInterval(()=>{
        let colors = ["#ff4dff","#00ffff","#ffff00","#ff0000","#00ff00"];
        name.style.color = colors[Math.floor(Math.random()*colors.length)];
    },500);
}

/* SURPRISE BUTTON */
function goSurprise(){
    showGirl();
}

</script>
