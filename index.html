<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
  background: linear-gradient(#ff9a9e, #fad0c4);
}

/* NAME */
#name {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  font-size: 50px;
  font-family: "Brush Script MT", cursive;
  animation: colorChange 1s infinite;
  text-shadow: 0 0 10px white, 0 0 20px yellow;
}

@keyframes colorChange {
  0% {color: red;}
  25% {color: green;}
  50% {color: blue;}
  75% {color: yellow;}
  100% {color: magenta;}
}

/* CAKE */
#cake {
  position: absolute;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  width: 220px;
}

/* BUTTONS */
.buttons {
  position: absolute;
  bottom: 20px;
  width: 100%;
  text-align: center;
}

.buttons button {
  padding: 10px 20px;
  margin: 5px;
  font-size: 16px;
  cursor: pointer;
}

/* BALLOONS */
.balloon {
  position: absolute;
  width: 70px;
  animation: floatUp 6s linear forwards;
  cursor: pointer;
}

@keyframes floatUp {
  from {transform: translateY(100vh);}
  to {transform: translateY(-150px);}
}

/* BLAST */
.blast {
  position: absolute;
  width: 100px;
  pointer-events: none;
  animation: blastAnim 0.5s forwards;
}

@keyframes blastAnim {
  0% {transform: scale(0.5); opacity:1;}
  100% {transform: scale(1.5); opacity:0;}
}

/* FIREWORK CANVAS */
canvas {
  position: absolute;
  top: 0;
  left: 0;
}
</style>
</head>

<body>

<div id="name">Sahitya</div>

<!-- FIXED CAKE IMAGE -->
<img id="cake" src="https://cdn.pixabay.com/photo/2016/03/31/19/14/cake-1293096_1280.png">

<canvas id="fireworks"></canvas>

<div class="buttons">
  <button onclick="entry()">Entry</button>
  <button onclick="cutCake()">Cut Cake</button>
  <button onclick="surprise()">Surprise</button>
</div>

<script>

/* FIREWORK SYSTEM */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function createFirework(x, y) {
  for (let i = 0; i < 80; i++) {
    particles.push({
      x: x,
      y: y,
      dx: (Math.random() - 0.5) * 10,
      dy: (Math.random() - 0.5) * 10,
      life: 100
    });
  }
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  particles.forEach((p, i) => {
    p.x += p.dx;
    p.y += p.dy;
    p.life--;

    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();

    if (p.life <= 0) particles.splice(i, 1);
  });

  requestAnimationFrame(animate);
}
animate();

/* BUTTONS */
function entry() {
  alert("Entry Started 🎉");
}

function cutCake() {
  createFirework(window.innerWidth / 2, 200);
  setTimeout(() => {
    createFirework(window.innerWidth / 2, 150);
  }, 500);
}

/* BALLOONS */
function surprise() {
  for (let i = 0; i < 6; i++) {
    let b = document.createElement("img");
    b.src = "https://cdn.pixabay.com/photo/2014/04/03/11/55/balloon-312297_1280.png";
    b.className = "balloon";
    b.style.left = Math.random() * window.innerWidth + "px";

    b.onclick = function(e) {
      blast(e.clientX, e.clientY);
      b.remove();
    };

    document.body.appendChild(b);

    setTimeout(() => b.remove(), 6000);
  }
}

/* BLAST */
function blast(x, y) {
  let img = document.createElement("img");
  img.src = "https://cdn.pixabay.com/photo/2013/07/12/13/57/explosion-147909_1280.png";
  img.className = "blast";

  img.style.left = (x - 50) + "px";
  img.style.top = (y - 50) + "px";

  document.body.appendChild(img);

  setTimeout(() => img.remove(), 500);
}

</script>

</body>
</html>
