<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:Arial;
  background:linear-gradient(#ffe6f0,#fff);
}

/* NAME */
#name{
  position:absolute;
  top:20px;
  width:100%;
  text-align:center;
  font-size:50px;
  font-family:"Brush Script MT",cursive;
  animation:glow 1s infinite alternate;
}

@keyframes glow{
  0%{color:#ff00cc;text-shadow:0 0 10px #ff00cc;}
  100%{color:#00cc66;text-shadow:0 0 20px #00cc66;}
}

/* CAKE (CSS DRAWN - NO IMAGE) */
#cake{
  position:absolute;
  bottom:120px;
  left:50%;
  transform:translateX(-50%);
  width:180px;
  height:120px;
  background:#ff99cc;
  border-radius:10px;
  box-shadow:0 0 20px pink;
}

#cake:before{
  content:'';
  position:absolute;
  top:-40px;
  left:20px;
  width:140px;
  height:40px;
  background:#ff66b2;
  border-radius:10px;
}

#cake:after{
  content:'🎂';
  position:absolute;
  top:-50px;
  left:50%;
  transform:translateX(-50%);
  font-size:40px;
}

/* BUTTONS */
.buttons{
  position:absolute;
  bottom:20px;
  width:100%;
  text-align:center;
}

button{
  padding:10px 20px;
  margin:5px;
  font-size:16px;
}

/* BALLOON */
.balloon{
  position:absolute;
  font-size:40px;
  cursor:pointer;
  animation:up 6s linear forwards;
}

@keyframes up{
  from{transform:translateY(100vh);}
  to{transform:translateY(-150px);}
}

/* BLAST */
.blast{
  position:absolute;
  font-size:40px;
  animation:boom 0.5s forwards;
}

@keyframes boom{
  0%{transform:scale(0.5);opacity:1;}
  100%{transform:scale(2);opacity:0;}
}

/* FIREWORK */
canvas{
  position:absolute;
  top:0;
  left:0;
}
</style>
</head>

<body>

<div id="name">Sahitya</div>

<div id="cake"></div>

<canvas id="fire"></canvas>

<div class="buttons">
  <button onclick="entry()">Entry</button>
  <button onclick="cutCake()">Cut Cake</button>
  <button onclick="surprise()">Surprise</button>
</div>

<script>

/* FIREWORK */
let c=document.getElementById("fire");
let ctx=c.getContext("2d");
c.width=window.innerWidth;
c.height=window.innerHeight;

let p=[];

function fire(x,y){
  for(let i=0;i<60;i++){
    p.push({
      x:x,y:y,
      dx:(Math.random()-0.5)*8,
      dy:(Math.random()-0.5)*8,
      life:100
    });
  }
}

function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  p.forEach((a,i)=>{
    a.x+=a.dx;
    a.y+=a.dy;
    a.life--;
    ctx.beginPath();
    ctx.arc(a.x,a.y,3,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();
    if(a.life<=0)p.splice(i,1);
  });
  requestAnimationFrame(draw);
}
draw();

/* BUTTONS */
function entry(){
  alert("Entry 🎉");
}

function cutCake(){
  fire(window.innerWidth/2,200);
}

/* BALLOONS */
function surprise(){
  for(let i=0;i<6;i++){
    let b=document.createElement("div");
    b.className="balloon";
    b.innerHTML="🎈";
    b.style.left=Math.random()*window.innerWidth+"px";

    b.onclick=(e)=>{
      blast(e.clientX,e.clientY);
      b.remove();
    };

    document.body.appendChild(b);
    setTimeout(()=>b.remove(),6000);
  }
}

/* BLAST */
function blast(x,y){
  let b=document.createElement("div");
  b.className="blast";
  b.innerHTML="💥";
  b.style.left=x+"px";
  b.style.top=y+"px";

  document.body.appendChild(b);
  setTimeout(()=>b.remove(),500);
}

</script>

</body>
</html>
