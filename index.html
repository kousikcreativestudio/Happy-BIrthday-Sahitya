<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:url("https://i.ibb.co/JwMLHkGT/background.jpg") no-repeat center/cover;
    height:100vh;
    overflow:hidden;
    text-align:center;
}

/* GIRL */
.girl{
    width:100px;
    position:fixed;
    bottom:80px;
    left:-120px;
    transition:2s;
}

/* walk to cake */
.to-cake{
    left:42%;
}

/* KNIFE */
.knife{
    width:70px;
    position:fixed;
    bottom:120px;
    left:60%;
    display:none;
    transition:1s;
}

/* knife to hand */
.hold-knife{
    left:47%;
    bottom:110px;
    transform:rotate(-30deg);
}

/* cutting motion */
.cut-motion{
    transform:rotate(-30deg) translateY(40px);
}

/* CAKE CENTER */
.cake-box{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* cake halves */
.half{
    width:180px;
    position:absolute;
    transition:1s;
}

.left{
    clip-path: inset(0 50% 0 0);
}

.right{
    clip-path: inset(0 0 0 50%);
}

/* split */
.cut-left{
    transform:translateX(-35px);
}

.cut-right{
    transform:translateX(35px);
}

/* BUTTONS */
.btns{
    position:fixed;
    bottom:10px;
    width:100%;
}

.img-btn{
    width:110px;
    margin:5px;
    cursor:pointer;
}

/* MOBILE */
@media(max-width:600px){
    .girl{width:80px;}
    .half{width:140px;}
    .img-btn{width:90px;}
}
</style>
</head>

<body>

<!-- GIRL -->
<img id="girl" class="girl" src="https://i.ibb.co/rRx3bbfZ/girl.png">

<!-- KNIFE -->
<img id="knife" class="knife" src="https://i.ibb.co/WNcGgx7j/knife.png">

<!-- CAKE -->
<div class="cake-box">
    <img id="cakeLeft" class="half left" src="https://i.ibb.co/v6QqKVRT/cake.png">
    <img id="cakeRight" class="half right" src="https://i.ibb.co/v6QqKVRT/cake.png">
</div>

<!-- BUTTONS -->
<div class="btns">

<img src="https://i.ibb.co/fz19TN1B/entry.png" onclick="showGirl()" class="img-btn">

<img src="https://i.ibb.co/kV0X2gqY/cut-cake.png" onclick="cutCake()" class="img-btn">

<img src="https://i.ibb.co/TDdCnYTj/Surprise.png" onclick="goSurprise()" class="img-btn">

</div>

<script>

/* ENTRY */
function showGirl(){
    document.getElementById("girl").classList.add("to-cake");
}

/* CUT CAKE REAL ANIMATION */
function cutCake(){

    let girl = document.getElementById("girl");
    let knife = document.getElementById("knife");

    // step 1: girl goes to cake
    girl.classList.add("to-cake");

    // step 2: show knife
    setTimeout(()=>{
        knife.style.display="block";
    },1200);

    // step 3: knife to hand
    setTimeout(()=>{
        knife.classList.add("hold-knife");
    },1800);

    // step 4: hand cutting motion
    setTimeout(()=>{
        knife.classList.add("cut-motion");
    },2500);

    // step 5: cake splits
    setTimeout(()=>{
        document.getElementById("cakeLeft").classList.add("cut-left");
        document.getElementById("cakeRight").classList.add("cut-right");
    },3200);
}

/* SURPRISE PAGE */
function goSurprise(){
    window.location.href="surprise.html";
}

</script>

</body>
</html>
