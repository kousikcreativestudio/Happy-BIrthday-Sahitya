<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎉 Happy Birthday Sahitya 🎂</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  text-align: center;
  color: white;
  background: url('background.jpg') no-repeat center center/cover;
  overflow: hidden;
}

/* Title */
h1 {
  margin-top: 30px;
  font-size: 36px;
  text-shadow: 2px 2px 10px black;
}

/* Buttons */
button {
  padding: 12px 25px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  background: orange;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

/* Cake */
#cake {
  width: 180px;
  margin-top: 20px;
}

/* Girl */
#girl {
  position: absolute;
  bottom: 0;
  left: 10px;
  width: 200px;
}

/* Balloons */
.balloon {
  position: absolute;
  width: 60px;
  animation: float 6s linear infinite;
}

/* Balloon animation */
@keyframes float {
  0% { transform: translateY(100vh); }
  100% { transform: translateY(-100vh); }
}

/* Message */
#msg {
  display: none;
  font-size: 22px;
  margin-top: 15px;
}
</style>
</head>

<body>

<h1>🎉 Happy Birthday Sahitya 🎂</h1>

<button onclick="cutCake()">🎂 Cut Cake</button>
<button onclick="openSurprise()">🎁 Surprise</button>

<br>

<img id="cake" src="cake.png">

<div id="msg">💖 You are very special 💖</div>

<!-- Girl -->
<img id="girl" src="girl.png">

<!-- Balloons -->
<img src="balloon.png" class="balloon" style="left:10%;">
<img src="balloon.png" class="balloon" style="left:30%; animation-delay:1s;">
<img src="balloon.png" class="balloon" style="left:50%; animation-delay:2s;">
<img src="balloon.png" class="balloon" style="left:70%; animation-delay:3s;">
<img src="balloon.png" class="balloon" style="left:90%; animation-delay:4s;">

<script>

// Cake click
function cutCake() {
  document.getElementById("msg").style.display = "block";
}

// Open new page
function openSurprise() {
  window.open("surprise.html", "_blank");
}

</script>

</body>
</html>
