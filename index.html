<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    overflow:hidden;
    background:url("https://i.ibb.co/JwMLHkGT/background.jpg") no-repeat center/cover;
}

/* 👧 GIRL WALK */
.girl{
    width:170px;
    position:fixed;
    top:50%;
    left:-200px;
    transform:translateY(-50%);
    transition:left 3s linear;
    z-index:5;
}

/* WALK EFFECT */
.walk{
    animation:walkMove 0.5s infinite alternate;
}

@keyframes walkMove{
    0%{ transform:translateY(-50%) rotate(0deg); }
    50%{ transform:translateY(-48%) rotate(1deg); }
    100%{ transform:translateY(-50%) rotate(-1deg); }
}

.to-cake{ left:57%; }

/* 🎂 CAKE */
.cake-box{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}
.half{
    width:160px;
    position:absolute;
    transition:1s;
}
.left{ clip-path: inset(0 50% 0 0); }
.right{ clip-path: inset(0 0 0 50%); }
.cut-left{ transform:translateX(-40px); }
.cut-right{ transform:translateX(40px); }

/* 🔪 KNIFE */
.knife{
    width:90px;
    position:fixed;
    top:50%;
    left:70%;
    transform:translateY(-50%);
    display:none;
}
.hold{ left:62%; transform:translateY(-50%) rotate(-40deg); }
.cut{ transform:translateY(-20%) rotate(-40deg); }

/* 🎆 FIREWORKS */
#fireworks{
    position:fixed;
    width:100%;
    height:100%;
    pointer-events:none;
}
.fire{
    position:absolute;
    width:200px;
    animation:boom 1.5s linear;
}
@keyframes boom{
    0%{transform:scale(0.5);opacity:1;}
    100%{transform:scale(2.5);opacity:0;}
}

/* 🎈 BALLOONS */
#balloons{
    position:fixed;
    width:100%;
    height:100%;
    z-index:10;
}
.balloon{
    width:80px;
    position:absolute;
    bottom:-120px;
    animation:floatUp 7s linear infinite;
}
@keyframes floatUp{
    0%{transform:translateY(0);}
    100%{transform:translateY(-130vh);}
}

/* 💥 BLAST */
.blast{
    position:fixed;
    width:120px;
    pointer-events:none;
    transform:translate(-50%,-50%) scale(0.5);
    z-index:999;
}

/* ✨ NAME */
#name{
    position:fixed;
    top:6%;
    left:50%;
    transform:translateX(-50%);
    font-size:60px;
    font-family:"Brush Script MT",cursive;
    display:none;
    color:#ff4dff;
    text-shadow:0 0 10px currentColor,
                0 0 20px currentColor,
                0 0 30px currentColor;
}

/* BUTTONS */
.btns{
    position:fixed;
    bottom:10px;
    width:100%;
    text-align:center;
}
.img-btn{
    width:110px;
    margin:5px;
    cursor:pointer;
}

</style>
</head>

<body>

<div id="fireworks"></div>
<div id="balloons"></div>

<h1 id="name">Sahitya</h1>

<img id="girl" class="girl" src="https://i.ibb.co/rRx3bbfZ/girl.png">
<img id="knife" class="knife" src="https://i.ibb.co/WNcGgx7j/knife.png">

<div class="cake-box">
    <img id="cakeLeft" class="half left" src="https://i.ibb.co/v6QqKVRT/cake.png">
    <img id="cakeRight" class="half right" src="https://i.ibb.co/v6QqKVRT/cake.png">
</div>

<div class="btns">
    <img src="https://i.ibb.co/fz19TN1B/entry.png" onclick="showGirl()" class="img-btn">
    <img src="https://i.ibb.co/kV0X2gqY/cut-cake.png" onclick="cutCake()" class="img-btn">
    <img src="https://i.ibb.co/TDdCnYTj/Surprise.png" onclick="goSurprise()" class="img-btn">
</div>

<script>

/* 👧 WALK */
function showGirl(){
    let g = document.getElementById("girl");
    g.classList.add("walk");
    g.classList.add("to-cake");

    setTimeout(()=>{ g.classList.remove("walk"); },3000);
}

/* CUT */
function cutCake(){

    showGirl();

    let knife = document.getElementById("knife");

    setTimeout(()=>{ knife.style.display="block"; },1200);
    setTimeout(()=>{ knife.classList.add("hold"); },1800);
    setTimeout(()=>{ knife.classList.add("cut"); },2500);

    setTimeout(()=>{
        document.getElementById("cakeLeft").classList.add("cut-left");
        document.getElementById("cakeRight").classList.add("cut-right");
    },3200);

    setTimeout(()=>{
        document.getElementById("name").style.display="block";
        startColorChange();
        startFireworks();
        startBalloons();
    },3600);
}

/* FIREWORKS */
function startFireworks(){
    let c = document.getElementById("fireworks");

    setInterval(()=>{
        let f = document.createElement("img");
        f.src="https://i.ibb.co/8QLGcnS/Pngtree-fireworks-for-new-years-celebration-20180243.png";
        f.className="fire";
        f.style.left=Math.random()*95+"%";
        f.style.top=Math.random()*70+"%";
        c.appendChild(f);
        setTimeout(()=>f.remove(),1500);
    },200);
}

/* BALLOONS */
function startBalloons(){
    let c = document.getElementById("balloons");

    setInterval(()=>{
        let b=document.createElement("img");
        b.src="https://i.ibb.co/8VzV5Rv/balloon.png";
        b.className="balloon";
        b.style.left=Math.random()*90+"%";

        b.onclick=(e)=>{
            createBlast(e.clientX,e.clientY);
            b.remove();
        };

        c.appendChild(b);
        setTimeout(()=>b.remove(),7000);
    },700);
}

/* 💥 BLAST */
function createBlast(x,y){

    let blast=document.createElement("img");
    blast.src="https://i.ibb.co/MDNbcwdM/blast-effect.png";
    blast.className="blast";

    blast.style.left=x+"px";
    blast.style.top=y+"px";

    document.body.appendChild(blast);

    setTimeout(()=>{
        blast.style.transition="0.5s";
        blast.style.transform="translate(-50%,-50%) scale(2)";
        blast.style.opacity="0";
    },10);

    setTimeout(()=>blast.remove(),600);
}

/* TEXT COLOR */
function startColorChange(){
    let name=document.getElementById("name");
    let colors=["#ff4dff","#00ffff","#ffff00","#ff0000","#00ff00","#ff8800"];
    let i=0;

    setInterval(()=>{
        name.style.color=colors[i];
        i=(i+1)%colors.length;
    },1000);
}

/* SURPRISE */
function goSurprise(){
    window.location.href="surprise.html";
}

</script>

</body>
</html>
