<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  text-align: center;
  background: linear-gradient(45deg, #ff0080, #7928ca, #2afadf);
  color: white;
  overflow: hidden;
}

h1 {
  margin-top: 20px;
  font-size: 2.5rem;
}

button {
  padding: 12px 20px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  background: orange;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

/* Cake */
#cake {
  width: 200px;
  margin-top: 40px;
  transition: transform 1s;
}

/* Cut animation */
.cut {
  transform: rotateX(60deg) scale(0.8);
}

/* Fireworks */
.firework {
  position: absolute;
  width: 5px;
  height: 5px;
  background: yellow;
  border-radius: 50%;
  animation: explode 1s linear forwards;
}

@keyframes explode {
  to {
    transform: translate(var(--x), var(--y));
    opacity: 0;
  }
}

/* Message */
#message {
  display: none;
  font-size: 24px;
  margin-top: 20px;
}

/* Touch effect */
.touch {
  position: absolute;
  width: 20px;
  height: 20px;
  background: white;
  border-radius: 50%;
  animation: touchAnim 0.5s ease-out;
}

@keyframes touchAnim {
  to {
    transform: scale(3);
    opacity: 0;
  }
}

</style>
</head>

<body>

<h1>🎉 Happy Birthday Sahitya 🎂</h1>

<button onclick="cutCake()">🎂 Cut Cake</button>
<button onclick="openSurprise()">🎁 Surprise</button>
<button onclick="downloadSite()">⬇ Download</button>

<br>

<img id="cake" src="https://i.imgur.com/8Km9tLL.png">

<div id="message">🎉 Many many happy returns of the day! 🎉</div>

<script>

// Cake cut
function cutCake() {
  document.getElementById("cake").classList.add("cut");
  document.getElementById("message").style.display = "block";

  startFireworks();
}

// Fireworks
function startFireworks() {
  for (let i = 0; i < 50; i++) {
    let fw = document.createElement("div");
    fw.className = "firework";

    fw.style.left = "50%";
    fw.style.top = "50%";

    fw.style.setProperty("--x", (Math.random()*400 - 200) + "px");
    fw.style.setProperty("--y", (Math.random()*400 - 200) + "px");

    document.body.appendChild(fw);

    setTimeout(() => fw.remove(), 1000);
  }
}

// Surprise → open new page
function openSurprise() {
  let newWindow = window.open("", "_blank");

  newWindow.document.write(`
    <html>
    <head>
    <title>Surprise 🎁</title>
    <style>
      body {
        background: black;
        color: white;
        text-align: center;
        font-size: 30px;
        padding-top: 100px;
      }
    </style>
    </head>
    <body>
      🎉 SURPRISE 🎉<br><br>
      You are special 💖<br>
      Stay happy always 😊
    </body>
    </html>
  `);
}

// Touch effect (mobile + desktop)
document.addEventListener("click", function(e) {
  let t = document.createElement("div");
  t.className = "touch";
  t.style.left = e.clientX + "px";
  t.style.top = e.clientY + "px";
  document.body.appendChild(t);

  setTimeout(() => t.remove(), 500);
});

// Download site
function downloadSite() {
  const content = document.documentElement.outerHTML;
  const blob = new Blob([content], {type: "text/html"});
  const a = document.createElement("a");

  a.href = URL.createObjectURL(blob);
  a.download = "birthday.html";
  a.click();
}

</script>

</body>
</html>
