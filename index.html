<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    overflow:hidden;
    background:url("https://i.ibb.co/JwMLHkGT/background.jpg") no-repeat center/cover;
    height:100vh;
}

/* GIRL */
.girl{
    width:170px;
    position:fixed;
    top:50%;
    left:-200px;
    transform:translateY(-50%);
    transition:2s;
    z-index:5;
}
.to-cake{ left:57%; }

/* 👨 PERSON */
.person{
    width:170px;
    position:fixed;
    top:50%;
    right:-200px;
    transform:translateY(-50%);
    transition:2s;
    z-index:5;
}
.person-enter{ right:10%; }

/* CAKE */
.cake-box{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:5;
}
.half{
    width:160px;
    position:absolute;
    transition:1s;
}
.left{ clip-path: inset(0 50% 0 0); }
.right{ clip-path: inset(0 0 0 50%); }
.cut-left{ transform:translateX(-40px); }
.cut-right{ transform:translateX(40px); }

/* KNIFE */
.knife{
    width:90px;
    position:fixed;
    top:50%;
    left:70%;
    transform:translateY(-50%);
    display:none;
    transition:1s;
    z-index:6;
}
.hold{ left:62%; transform:translateY(-50%) rotate(-40deg); }
.cut{ transform:translateY(-20%) rotate(-40deg); }

/* NAME */
#name{
    position:fixed;
    top:6%;
    left:50%;
    transform:translateX(-50%);
    font-size:60px;
    display:none;
    z-index:20;
    color:#ff4dff;
}

/* BUTTONS */
.btns{
    position:fixed;
    bottom:10px;
    width:100%;
    text-align:center;
    z-index:20;
}
.img-btn{
    width:110px;
    margin:5px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1 id="name">Sahitya</h1>

<!-- GIRL -->
<img id="girl" class="girl" src="https://i.ibb.co/rRx3bbfZ/girl.png">

<!-- PERSON -->
<img id="person" class="person" src="https://i.ibb.co/2kR1w0G/person.png">

<!-- KNIFE -->
<img id="knife" class="knife" src="https://i.ibb.co/gZcfN3Gq/knife.png">

<!-- CAKE -->
<div class="cake-box">
    <img id="cakeLeft" class="half left" src="https://i.ibb.co/v6QqKVRT/cake.png">
    <img id="cakeRight" class="half right" src="https://i.ibb.co/v6QqKVRT/cake.png">
</div>

<!-- BUTTONS -->
<div class="btns">
    <img src="https://i.ibb.co/zTSpz0pH/entry.png" onclick="showGirl()" class="img-btn">
    <img src="https://i.ibb.co/Hjg8rJ8/cut-cake.png" onclick="cutCake()" class="img-btn">
</div>

<script>

/* GIRL ENTRY */
function showGirl(){
    document.getElementById("girl").classList.add("to-cake");
}

/* MAIN FLOW */
function cutCake(){

    let girl = document.getElementById("girl");
    let person = document.getElementById("person");
    let knife = document.getElementById("knife");

    // girl comes
    girl.classList.add("to-cake");

    // person comes with cake
    setTimeout(()=>{
        person.classList.add("person-enter");
    },1000);

    // after reaching → show knife
    setTimeout(()=>{
        knife.style.display="block";
    },2500);

    // hold knife
    setTimeout(()=>{
        knife.classList.add("hold");
    },3000);

    // cut cake
    setTimeout(()=>{
        knife.classList.add("cut");

        document.getElementById("cakeLeft").classList.add("cut-left");
        document.getElementById("cakeRight").classList.add("cut-right");

    },3800);

    // hide knife
    setTimeout(()=>{
        knife.style.display="none";
    },4500);

    // feeding scene
    setTimeout(()=>{
        alert("🍰 Girl feeds cake to person ❤️");
        document.getElementById("name").style.display="block";
    },5200);
}

</script>

</body>
</html>
