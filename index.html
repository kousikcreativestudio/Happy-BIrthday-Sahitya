<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    background:#000;
    overflow:hidden;
    text-align:center;
    color:#fff;
    font-family:sans-serif;
}

.container{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* Cake */
.cake{
    width:150px;
    height:100px;
    background:#ffcc99;
    margin:20px auto;
    position:relative;
    border-radius:10px;
}

/* Knife Image */
.knife{
    position:absolute;
    width:120px;
    height:40px;
    background:url('https://i.ibb.co/gZcfN3Gq/knife.png') no-repeat center/contain;
    top:-60px;
    left:-150px;
    transform:rotate(-20deg);
}

/* Knife animation */
.cut-knife{
    animation:knifeMove 0.6s forwards;
}

@keyframes knifeMove{
    0%{left:-150px;top:-60px;transform:rotate(-20deg)}
    50%{left:30px;top:-10px;transform:rotate(0)}
    100%{left:50px;top:30px;transform:rotate(40deg)}
}

/* Cake slice */
.slice{
    position:absolute;
    width:50%;
    height:100%;
    right:0;
    background:#ffb380;
}

.slice-cut{
    animation:sliceMove 1s forwards;
}

@keyframes sliceMove{
    100%{transform:translateX(70px) rotate(10deg)}
}

/* Balloon */
.balloon{
    position:absolute;
    width:60px;
    height:80px;
    bottom:-100px;
    background:url('https://i.ibb.co/5gWyxXRD/balloon.png') no-repeat center/contain;
    animation:float 6s linear infinite;
}

@keyframes float{
    100%{transform:translateY(-120vh)}
}

/* Firework */
.firework{
    position:absolute;
    width:50px;
    height:50px;
    background:url('https://i.ibb.co/bg10RJSM/Pngtree-fireworks-for-new-years-celebration-20180243.png') no-repeat center/contain;
}

/* Shake */
.shake{animation:shake 0.4s}
@keyframes shake{
0%{transform:translate(0)}
25%{transform:translate(5px)}
50%{transform:translate(-5px)}
75%{transform:translate(5px)}
100%{transform:translate(0)}
}
</style>
</head>

<body>

<div class="container" id="mainBox">

<h1>🎉 Happy Birthday 🎉</h1>
<h2 id="nameText">Your Name</h2>

<div class="cake">
    <div class="knife" id="knife"></div>
    <div class="slice" id="slice"></div>
</div>

<!-- IMAGE BUTTONS -->
<img src="https://i.ibb.co/zTSpz0pH/entry.png" width="120" onclick="changeName()">
<img src="https://i.ibb.co/Hjg8rJ8/cut-cake.png" width="120" onclick="cutCake()">
<img src="https://i.ibb.co/d1pk4fK/Surprise.png" width="120" onclick="surprise()">

</div>

<script>

/* Name */
function changeName(){
 let n=prompt("Enter Name:");
 if(n) document.getElementById("nameText").innerText=n;
}

/* Surprise */
function surprise(){
 alert("🎉 Enjoy your day!");
}

/* Balloons */
for(let i=0;i<20;i++){
 let b=document.createElement("div");
 b.className="balloon";
 b.style.left=Math.random()*100+"vw";
 document.body.appendChild(b);
}

/* Fireworks */
setInterval(()=>{
 let f=document.createElement("div");
 f.className="firework";
 f.style.left=Math.random()*100+"vw";
 f.style.top=Math.random()*60+"vh";
 document.body.appendChild(f);
 setTimeout(()=>f.remove(),1000);
},700);

/* CUT CAKE */
function cutCake(){

 let knife=document.getElementById("knife");

 // knife move
 knife.classList.add("cut-knife");

 // slice after hit
 setTimeout(()=>{
  document.getElementById("slice").classList.add("slice-cut");
 },400);

 // shake
 let box=document.getElementById("mainBox");
 box.classList.add("shake");
 setTimeout(()=>box.classList.remove("shake"),400);

 // blast effect
 let blast=document.createElement("img");
 blast.src="https://i.ibb.co/N6664TPK/blast-effect.png";
 blast.style.position="absolute";
 blast.style.left="50%";
 blast.style.top="50%";
 blast.style.transform="translate(-50%,-50%)";
 blast.style.width="150px";
 document.body.appendChild(blast);

 setTimeout(()=>blast.remove(),700);

 // hide knife
 setTimeout(()=>{
  knife.style.display="none";
 },700);

 alert("🎂 Cake Cut!");
}

</script>

</body>
</html>
