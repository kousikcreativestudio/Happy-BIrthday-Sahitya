<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    overflow:hidden;
    background:url("https://i.ibb.co/Df5HvrdX/background.jpg") no-repeat center/cover;
    height:100vh;
}

/* GIRL */
.girl{
    width:170px;
    position:fixed;
    top:50%;
    left:-200px;
    transform:translateY(-50%);
    transition:2s;
    z-index:5;
}
.to-cake{ left:57%; }

/* CAKE */
.cake-box{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:5;
}
.half{
    width:160px;
    position:absolute;
    transition:1s;
}
.left{ clip-path: inset(0 50% 0 0); }
.right{ clip-path: inset(0 0 0 50%); }
.cut-left{ transform:translateX(-40px); }
.cut-right{ transform:translateX(40px); }

/* KNIFE */
.knife{
    width:90px;
    position:fixed;
    top:50%;
    left:70%;
    transform:translateY(-50%);
    display:none;
    transition:1s;
    z-index:6;
}
.hold{ left:62%; transform:translateY(-50%) rotate(-40deg); }
.cut{ transform:translateY(-20%) rotate(-40deg); }

/* FIREWORKS */
#fireworks{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    pointer-events:none;
    z-index:1;
}
.fire{
    position:absolute;
    width:200px;
    animation:boom 1.5s linear;
}
@keyframes boom{
    0%{transform:scale(0.5);opacity:1;}
    100%{transform:scale(2.5);opacity:0;}
}

/* BALLOONS */
#balloons{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    z-index:10;
}
.balloon{
    width:80px;
    position:absolute;
    bottom:-120px;
    animation:floatUp 7s linear infinite;
    cursor:pointer;
}
@keyframes floatUp{
    0%{transform:translateY(0);}
    100%{transform:translateY(-130vh);}
}

/* BLAST */
.blast{
    position:absolute;
    width:90px;
    pointer-events:none;
    animation:blastAnim 0.6s linear;
    transform:translate(-50%,-50%);
}
@keyframes blastAnim{
    0%{transform:translate(-50%,-50%) scale(0.5);opacity:1;}
    100%{transform:translate(-50%,-50%) scale(2);opacity:0;}
}

/* NAME */
#name{
    position:fixed;
    top:6%;
    left:50%;
    transform:translateX(-50%);
    font-size:60px;
    font-family:"Brush Script MT",cursive;
    display:none;
    z-index:20;

    color:#ff4dff;
    text-shadow:0 0 10px currentColor,
                0 0 20px currentColor,
                0 0 30px currentColor;
}

/* BUTTONS */
.btns{
    position:fixed;
    bottom:10px;
    width:100%;
    text-align:center;
    z-index:20;
}
.img-btn{
    width:110px;
    margin:5px;
    cursor:pointer;
}

/* MOBILE */
@media(max-width:600px){
    .girl{width:120px;}
    .half{width:120px;}
    #name{font-size:40px;}
}
</style>
</head>

<body>

<div id="fireworks"></div>
<div id="balloons"></div>

<h1 id="name">Sahitya</h1>

<img id="girl" class="girl" src="https://i.ibb.co/xSX5y5Xk/girl.png">
<img id="knife" class="knife" src="https://i.ibb.co/SThLLvP/knife.png">

<div class="cake-box">
    <img id="cakeLeft" class="half left" src="https://i.ibb.co/vx3F7tzv/cake.png">
    <img id="cakeRight" class="half right" src="https://i.ibb.co/vx3F7tzv/cake.png">
</div>

<div class="btns">
    <img src="https://i.ibb.co/VW1ZrHnz/entry.png" onclick="showGirl()" class="img-btn">
    <img src="https://i.ibb.co/dq0n4tj/cut-cake.png" onclick="cutCake()" class="img-btn">
    <img src="https://i.ibb.co/tT9r91qw/Surprise.png" onclick="goSurprise()" class="img-btn">
</div>

    <audio id="music" preload="auto" playsinline>
  <source src="https://files.catbox.moe/m78pzg.mp3" type="audio/mpeg">
</audio>

<script>

/* GIRL */
function showGirl(){
    document.getElementById("girl").classList.add("to-cake");
}

/* CUT */
function cutCake(){

  let music = document.getElementById("music");

  // 🔥 FORCE USER INTERACTION LINK
  if (e) {
    music.play().then(()=>{
      console.log("Playing ✅");
    }).catch(err=>{
      console.log("Blocked ❌", err);
    });
  }
    
    let knife = document.getElementById("knife");

    document.getElementById("girl").classList.add("to-cake");

    setTimeout(()=>{ knife.style.display="block"; },1200);
    setTimeout(()=>{ knife.classList.add("hold"); },1800);
    setTimeout(()=>{ knife.classList.add("cut"); },2500);

    setTimeout(()=>{
        document.getElementById("cakeLeft").classList.add("cut-left");
        document.getElementById("cakeRight").classList.add("cut-right");
    },3200);

  setTimeout(()=>{
    document.getElementById("name").style.display="block";
    startColorChange();
    startFireworks();
    startBalloons();
},3600);
}

/* FIREWORKS */
function startFireworks(){
    let container = document.getElementById("fireworks");

    setInterval(()=>{
        let fire = document.createElement("img");
        fire.src="https://i.ibb.co/LXrbZw26/fireworks.png";
        fire.className="fire";

        fire.style.left = Math.random()*95 + "%";
        fire.style.top = Math.random()*70 + "%";

        container.appendChild(fire);
        setTimeout(()=>{ fire.remove(); },1500);
    },200);
}

/* BALLOONS (YOUR IMAGE FIXED) */
function startBalloons(){
    let container = document.getElementById("balloons");

    setInterval(()=>{
        let b = document.createElement("img");

        /* YOUR IMAGE */
        b.src="https://i.ibb.co/4wYcxyBM/balloon.png";

        b.className="balloon";
        b.style.left = Math.random()*90 + "%";

        b.onclick = function(e){
            createBlast(e.clientX, e.clientY);
            b.remove();
        };

        container.appendChild(b);

        setTimeout(()=>{ b.remove(); },7000);
    },700);
}

/* BLAST */
function createBlast(x,y){

    let blast = document.createElement("img");

    /* YOUR BLAST IMAGE */
    blast.src = "https://i.ibb.co/84ry1Jk8/blast-effect.png";

    blast.style.position = "fixed";
    blast.style.left = x + "px";
    blast.style.top = y + "px";

    /* PERFECT CENTER */
    blast.style.transform = "translate(-50%,-50%) scale(0.5)";

    blast.style.width = "120px";
    blast.style.pointerEvents = "none";
    blast.style.zIndex = "999";

    document.body.appendChild(blast);

    /* ANIMATION */
    setTimeout(()=>{
        blast.style.transition = "0.5s";
        blast.style.transform = "translate(-50%,-50%) scale(1.8)";
        blast.style.opacity = "0";
    },10);

    setTimeout(()=>{
        blast.remove();
    },600);
}

/* COLOR TEXT */
function startColorChange(){
    let name = document.getElementById("name");

    let colors=["#ff4dff","#00ffff","#ffff00","#ff0000","#00ff00","#ff8800"];

    let i=0;

    setInterval(()=>{
        name.style.color = colors[i];
        i=(i+1)%colors.length;
    },1000);
}

/* SURPRISE */
function goSurprise(){
    window.location.href="surprise.html";
}
        /* START BALLOONS WHEN PAGE LOADS */
window.onload = function(){
    startBalloons();
};

</script>

</body>
</html>
