<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:url("https://i.ibb.co/JwMLHkGT/background.jpg") no-repeat center/cover;
    height:100vh;
    overflow:hidden;
}

/* GIRL */
.girl{
    width:170px;
    position:fixed;
    top:50%;
    left:-200px;
    transform:translateY(-50%);
    transition:2s;
}
.to-cake{ left:57%; }

/* CAKE */
.cake-box{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}
.half{
    width:160px;
    position:absolute;
    transition:1s;
}
.left{ clip-path: inset(0 50% 0 0); }
.right{ clip-path: inset(0 0 0 50%); }

.cut-left{ transform:translateX(-40px); }
.cut-right{ transform:translateX(40px); }

/* KNIFE */
.knife{
    width:90px;
    position:fixed;
    top:50%;
    left:70%;
    transform:translateY(-50%);
    display:none;
    transition:1s;
}
.hold{
    left:62%;
    transform:translateY(-50%) rotate(-40deg);
}
.cut{
    transform:translateY(-20%) rotate(-40deg);
}

/* FIREWORKS */
#fireworks{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
}
.fire{
    position:absolute;
    width:180px; /* EXTRA BIG */
    animation:boom 1.4s linear;
}
@keyframes boom{
    0%{transform:scale(0.4);opacity:1;}
    100%{transform:scale(2.2);opacity:0;}
}

/* 🌈 NAME */
#name{
    position:fixed;
    top:6%;
    left:50%;
    transform:translateX(-50%);
    font-size:65px;
    font-weight:bold;
    letter-spacing:6px;
    display:none;
    animation:colorGlow 2s infinite linear;
}

/* RAINBOW COLORS */
@keyframes colorGlow{
    0%{color:#ff0000; text-shadow:0 0 10px #ff0000;}
    20%{color:#ff9900; text-shadow:0 0 15px #ff9900;}
    40%{color:#00ff00; text-shadow:0 0 15px #00ff00;}
    60%{color:#00ccff; text-shadow:0 0 15px #00ccff;}
    80%{color:#cc00ff; text-shadow:0 0 15px #cc00ff;}
    100%{color:#ff0000; text-shadow:0 0 10px #ff0000;}
}

/* ✨ MOVING LIGHT EFFECT */
#name::after{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.9), transparent);
    animation:shine 2s infinite;
}

@keyframes shine{
    0%{ left:-100%; }
    100%{ left:100%; }
}

/* BUTTONS */
.btns{
    position:fixed;
    bottom:10px;
    width:100%;
    text-align:center;
}
.img-btn{
    width:110px;
    margin:5px;
    cursor:pointer;
}

/* MOBILE */
@media(max-width:600px){
    .girl{width:120px;}
    .half{width:120px;}
    #name{font-size:40px;}
    .img-btn{width:90px;}
}
</style>
</head>

<body>

<div id="fireworks"></div>

<h1 id="name">Sahitya</h1>

<img id="girl" class="girl" src="https://i.ibb.co/rRx3bbfZ/girl.png">
<img id="knife" class="knife" src="https://i.ibb.co/WNcGgx7j/knife.png">

<div class="cake-box">
    <img id="cakeLeft" class="half left" src="https://i.ibb.co/v6QqKVRT/cake.png">
    <img id="cakeRight" class="half right" src="https://i.ibb.co/v6QqKVRT/cake.png">
</div>

<div class="btns">
    <img src="https://i.ibb.co/fz19TN1B/entry.png" onclick="showGirl()" class="img-btn">
    <img src="https://i.ibb.co/kV0X2gqY/cut-cake.png" onclick="cutCake()" class="img-btn">
    <img src="https://i.ibb.co/TDdCnYTj/Surprise.png" onclick="goSurprise()" class="img-btn">
</div>

<script>

function showGirl(){
    document.getElementById("girl").classList.add("to-cake");
}

function cutCake(){

    let knife = document.getElementById("knife");

    document.getElementById("girl").classList.add("to-cake");

    setTimeout(()=>{ knife.style.display="block"; },1200);
    setTimeout(()=>{ knife.classList.add("hold"); },1800);
    setTimeout(()=>{ knife.classList.add("cut"); },2500);

    setTimeout(()=>{
        document.getElementById("cakeLeft").classList.add("cut-left");
        document.getElementById("cakeRight").classList.add("cut-right");
    },3200);

    setTimeout(()=>{
        document.getElementById("name").style.display="block";
    },3600);

    setTimeout(()=>{
        startFireworks();
    },4200);
}

/* MORE DENSE FIREWORKS */
function startFireworks(){

    let container = document.getElementById("fireworks");

    setInterval(()=>{

        let fire = document.createElement("img");
        fire.src="https://i.ibb.co/8QLGcnS/Pngtree-fireworks-for-new-years-celebration-20180243.png";
        fire.className="fire";

        fire.style.left = Math.random()*95 + "%";
        fire.style.top = Math.random()*70 + "%";

        container.appendChild(fire);

        setTimeout(()=>{ fire.remove(); },1400);

    },200); // faster = more fireworks
}

function goSurprise(){
    window.location.href="surprise.html";
}

</script>

</body>
</html>
