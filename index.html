<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    overflow:hidden;
    background:url("https://i.ibb.co/Swd1Xpq1/background.jpg") no-repeat center/cover;
    height:100vh;
}

/* GIRL */
.girl{
    width:170px;
    position:fixed;
    top:50%;
    left:-200px;
    transform:translateY(-50%);
    transition:2s;
    z-index:5;
}
.to-cake{ left:55%; }

/* PERSON (SIDE ENTRY FIX) */
.person{
    width:170px;
    position:fixed;
    top:50%;
    right:-200px;
    transform:translateY(-50%);
    transition:2s;
    z-index:5;
}
.person-enter{
    right:30%;   /* SIDE POSITION (FIXED) */
}

/* CAKE (HIDDEN FIRST) */
.cake-box{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:5;
    display:none;   /* IMPORTANT FIX */
}
.half{
    width:160px;
    position:absolute;
    transition:1s;
}
.left{ clip-path: inset(0 50% 0 0); }
.right{ clip-path: inset(0 0 0 50%); }
.cut-left{ transform:translateX(-40px); }
.cut-right{ transform:translateX(40px); }

/* KNIFE */
.knife{
    width:90px;
    position:fixed;
    top:50%;
    left:70%;
    transform:translateY(-50%);
    display:none;
    transition:1s;
    z-index:6;
}
.hold{ left:60%; transform:translateY(-50%) rotate(-40deg); }
.cut{ transform:translateY(-20%) rotate(-40deg); }

/* FIREWORKS */
#fireworks{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    pointer-events:none;
    z-index:1;
}

/* NAME */
#name{
    position:fixed;
    top:6%;
    left:50%;
    transform:translateX(-50%);
    font-size:60px;
    font-family:"Brush Script MT",cursive;
    display:none;
    z-index:20;
    color:#ff4dff;
    text-shadow:0 0 10px currentColor,0 0 20px currentColor,0 0 30px currentColor;
}

/* BUTTONS */
.btns{
    position:fixed;
    bottom:10px;
    width:100%;
    text-align:center;
    z-index:20;
}
.img-btn{
    width:110px;
    margin:5px;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="fireworks"></div>

<h1 id="name">Sahitya</h1>

<img id="girl" class="girl" src="https://i.ibb.co/rRx3bbfZ/girl.png">

<!-- PERSON -->
<img id="person" class="person" src="https://i.ibb.co/YMzgYgD/boy-with-cake.png">

<!-- KNIFE -->
<img id="knife" class="knife" src="https://i.ibb.co/gZcfN3Gq/knife.png">

<!-- CAKE -->
<div class="cake-box" id="cakeBox">
    <img id="cakeLeft" class="half left" src="https://i.ibb.co/v6QqKVRT/cake.png">
    <img id="cakeRight" class="half right" src="https://i.ibb.co/v6QqKVRT/cake.png">
</div>

<!-- CAKE PIECE -->
<img id="cakePiece" src="https://i.ibb.co/tpjW68LS/cake-peace.png"
style="display:none; position:fixed; width:50px; left:58%; top:50%; transform:translate(-50%,-50%); z-index:999;">

<div class="btns">
    <img src="https://i.ibb.co/zTSpz0pH/entry.png" onclick="showGirl()" class="img-btn">
    <img src="https://i.ibb.co/Hjg8rJ8/cut-cake.png" onclick="cutCake()" class="img-btn">
</div>

<script>

function showGirl(){
    document.getElementById("girl").classList.add("to-cake");
}

function cutCake(){

    let girl = document.getElementById("girl");
    let person = document.getElementById("person");
    let knife = document.getElementById("knife");
    let cake = document.getElementById("cakeBox");
    let piece = document.getElementById("cakePiece");

    girl.classList.add("to-cake");

    // 👨 Person enters (SIDE)
    setTimeout(()=>{
        person.classList.add("person-enter");
    },1000);

    // 🎂 Show cake AFTER person gives
    setTimeout(()=>{
        cake.style.display="block";
    },2500);

    // 🔄 Change person image (no cake)
    setTimeout(()=>{
        person.src="https://i.ibb.co/6JPDVKXp/boy-standing.png";
    },2600);

    // 🔪 Knife show
    setTimeout(()=>{
        knife.style.display="block";
    },3000);

    setTimeout(()=>{
        knife.classList.add("hold");
    },3500);

    // ✂️ Cut
    setTimeout(()=>{
        knife.classList.add("cut");
        document.getElementById("cakeLeft").classList.add("cut-left");
        document.getElementById("cakeRight").classList.add("cut-right");
    },4200);

    // ❌ Hide knife
    setTimeout(()=>{
        knife.style.display="none";
    },5200);

    // 🍰 Give cake piece
    setTimeout(()=>{
        piece.style.display="block";
    },5500);

    // ❌ Hide piece
    setTimeout(()=>{
        piece.style.display="none";
    },7000);

    // 🎆 SHOW NAME + FIREWORKS
    setTimeout(()=>{
        document.getElementById("name").style.display="block";
        startFireworks();
    },5200);
}

/* FIREWORKS */
function startFireworks(){
    let container = document.getElementById("fireworks");

    setInterval(()=>{
        let fire = document.createElement("img");
        fire.src="https://i.ibb.co/bg10RJSM/Pngtree-fireworks-for-new-years-celebration-20180243.png";

        fire.style.position="absolute";
        fire.style.width="200px";
        fire.style.left=Math.random()*90+"%";
        fire.style.top=Math.random()*70+"%";

        container.appendChild(fire);
        setTimeout(()=>fire.remove(),1500);
    },300);
}

</script>

</body>
</html>
