<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 Happy Birthday Sahitya 🎂</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:Arial;
    text-align:center;
    color:white;
    background:url('https://i.ibb.co/JwMLHkGT/background.jpg') no-repeat center center fixed;
    background-size:cover;
    overflow:hidden;
}

.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
}

.container{
    position:relative;
    z-index:2;
    padding:20px;
}

button{
    padding:12px 18px;
    margin:10px;
    border:none;
    border-radius:10px;
    background:orange;
    color:white;
}

/* cake */
.cake{
    width:180px;
    margin-top:20px;
    transition:1s;
}

.cut{
    transform:scale(1.1) rotate(-8deg);
}

/* girl */
.girl{
    width:120px;
    position:fixed;
    bottom:-200px;
    left:10%;
    transition:2s;
}

.girl.show{
    bottom:50px;
}

.girl.walk{
    left:50%;
    transform:translateX(-50%);
}

/* balloons */
.balloon{
    position:fixed;
    width:50px;
    bottom:-100px;
    animation:float 8s linear infinite;
}

@keyframes float{
    to{transform:translateY(-120vh);}
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">
    <h1>🎉 Happy Birthday Sahitya 🎂</h1>
    <p>💖 You are very special 💖</p>

    <button onclick="showGirl()">👧 Entry</button>
    <button onclick="cutCake()">🍰 Cut Cake</button>
    <button onclick="goSurprise()">🎁 Surprise</button>

    <br>

    <img id="cake" class="cake" src="https://i.ibb.co/v6QqKVRT/cake.png">
</div>

<img id="girl" class="girl" src="https://i.ibb.co/rRx3bbfZ/girl.png">

<!-- balloons -->
<img class="balloon" src="https://i.ibb.co/4gPJP4L4/balloon.png" style="left:10%">
<img class="balloon" src="https://i.ibb.co/4gPJP4L4/balloon.png" style="left:40%">
<img class="balloon" src="https://i.ibb.co/4gPJP4L4/balloon.png" style="left:70%">

<script>
function showGirl(){
    document.getElementById("girl").classList.add("show");
}

function cutCake(){
    let girl = document.getElementById("girl");

    // girl walks to cake
    girl.classList.add("walk");

    setTimeout(()=>{
        document.getElementById("cake").classList.add("cut");
    },2000);

    setTimeout(()=>{
        alert("🎉 Cake Cut Successfully ❤️");
        girl.style.display="none";
    },3000);
}

function goSurprise(){
    window.location.href="surprise.html";
}
</script>

</body>
</html>
