<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 Happy Birthday Sahitya 🎂</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;

    /* 🎨 FULL BACKGROUND */
    background: url('https://images.unsplash.com/photo-1530103862676-de8c9debad1d') no-repeat center center/cover;
    min-height: 100vh;
}

/* Overlay */
.overlay {
    background: rgba(0,0,0,0.5);
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
}

/* Container */
.container {
    position: relative;
    z-index: 2;
    padding: 20px;
}

/* Title */
h1 {
    font-size: 28px;
    margin-top: 20px;
}

/* Buttons */
.buttons {
    margin: 15px 0;
}

button {
    padding: 10px 18px;
    font-size: 14px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    background: orange;
    color: white;
    cursor: pointer;
}

/* Cake */
.cake {
    width: 180px;
    max-width: 90%;
    margin-top: 20px;
    transition: transform 0.8s;
}

/* 🎂 Cake Cut Animation */
.cut {
    transform: rotate(-12deg) scale(1.05);
}

/* 🎁 Surprise */
#surprise {
    display: none;
    margin-top: 20px;
    animation: fadeIn 1.5s ease;
}

#surprise img {
    width: 80%;
    max-width: 250px;
    border-radius: 12px;
}

/* ✨ Animation */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

/* 📱 Mobile Fix */
@media (max-width: 600px) {
    h1 {
        font-size: 24px;
    }

    button {
        width: 45%;
        font-size: 13px;
    }

    .cake {
        width: 150px;
    }
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">
    <h1>🎉 Happy Birthday Sahitya 🎂</h1>
    <p>💖 You are very special 💖</p>

    <div class="buttons">
        <button onclick="cutCake()">🍰 Cut Cake</button>
        <button onclick="showSurprise()">🎁 Surprise</button>
    </div>

    <!-- 🎂 Cake -->
    <img id="cake" class="cake" src="https://i.imgur.com/8QfQY6p.png">

    <!-- 🎁 Surprise -->
    <div id="surprise">
        <h3>💝 Surprise 💝</h3>
        <img src="https://i.imgur.com/4AiXzf8.jpeg">
    </div>
</div>

<script>
function cutCake() {
    const cake = document.getElementById("cake");
    cake.classList.add("cut");

    setTimeout(() => {
        alert("🎉 Cake Cut Successfully ❤️");
    }, 700);
}

function showSurprise() {
    document.getElementById("surprise").style.display = "block";
}
</script>

</body>
</html>
