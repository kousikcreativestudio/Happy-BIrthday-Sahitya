<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 Happy Birthday Sahitya 🎂</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family: Arial;
    text-align:center;
    color:white;
    overflow-x:hidden;
    background:url('https://i.ibb.co/JwMLHkGT/background.jpg') no-repeat center center fixed;
    background-size:cover;
}

/* overlay */
.overlay{
    position:fixed;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.5);
}

/* content */
.container{
    position:relative;
    z-index:2;
    padding:20px;
}

h1{
    margin-top:20px;
    font-size:28px;
}

/* buttons */
button{
    padding:12px 18px;
    margin:10px;
    border:none;
    border-radius:10px;
    background:orange;
    color:white;
    font-size:14px;
}

/* 🎂 cake */
.cake{
    width:200px;
    margin-top:20px;
    transition:0.8s;
}

.cut{
    transform:rotate(-10deg) scale(1.05);
}

/* 👧 girl animation */
.girl{
    width:180px;
    position:fixed;
    bottom:-300px;
    left:50%;
    transform:translateX(-50%);
    transition:1.5s;
    z-index:3;
}

.girl.show{
    bottom:80px;
}

/* 🎈 balloons */
.balloon{
    position:fixed;
    width:60px;
    bottom:-100px;
    animation:floatUp 8s linear infinite;
}

@keyframes floatUp{
    0%{transform:translateY(0);}
    100%{transform:translateY(-120vh);}
}

/* 🎁 surprise */
#surprise{
    display:none;
    margin-top:20px;
}

#surprise img{
    width:90%;
    max-width:300px;
    border-radius:10px;
}

/* mobile */
@media(max-width:600px){
    h1{font-size:22px;}
    .cake{width:150px;}
    .girl{width:140px;}
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">
    <h1>🎉 Happy Birthday Sahitya 🎂</h1>
    <p>💖 You are very special 💖</p>

    <button onclick="cutCake()">🍰 Cut Cake</button>
    <button onclick="showSurprise()">🎁 Surprise</button>
    <button onclick="showGirl()">👧 Entry</button>

    <!-- 🎂 CAKE -->
    <img id="cake" class="cake" src="https://i.ibb.co/v6QqKVRT/cake.png">

    <!-- 🎁 SURPRISE -->
    <div id="surprise">
        <h2>💝 Surprise 💝</h2>
        <img src="https://i.ibb.co/DPdz7CNw/photo.jpg">
    </div>
</div>

<!-- 👧 GIRL -->
<img id="girl" class="girl" src="https://i.ibb.co/rRx3bbfZ/girl.png">

<!-- 🎈 BALLOONS -->
<img class="balloon" src="https://i.ibb.co/4gPJP4L4/balloon.png" style="left:10%;animation-delay:0s;">
<img class="balloon" src="https://i.ibb.co/4gPJP4L4/balloon.png" style="left:30%;animation-delay:2s;">
<img class="balloon" src="https://i.ibb.co/4gPJP4L4/balloon.png" style="left:50%;animation-delay:4s;">
<img class="balloon" src="https://i.ibb.co/4gPJP4L4/balloon.png" style="left:70%;animation-delay:1s;">
<img class="balloon" src="https://i.ibb.co/4gPJP4L4/balloon.png" style="left:90%;animation-delay:3s;">

<script>
function cutCake(){
    document.getElementById("cake").classList.add("cut");
    setTimeout(()=>{
        alert("🎉 Cake Cut Successfully ❤️");
    },700);
}

function showSurprise(){
    document.getElementById("surprise").style.display="block";
}

function showGirl(){
    document.getElementById("girl").classList.add("show");
}
</script>

</body>
</html>
