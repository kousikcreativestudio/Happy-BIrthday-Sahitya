<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    overflow:hidden;
    background:url("https://i.ibb.co/Swd1Xpq1/background.jpg") no-repeat center/cover;
    height:100vh;
}

/* BUTTON */
#btn{
    position:absolute;
    top:20px;
    left:20px;
    padding:10px 20px;
    font-size:18px;
    background:pink;
    border:none;
    border-radius:10px;
}

/* NAME */
#name{
    position:absolute;
    top:20px;
    width:100%;
    text-align:center;
    font-size:35px;
    display:none;
    animation:color 1s infinite alternate;
}
@keyframes color{
    from{color:white;}
    to{color:yellow;}
}

/* GIRL */
.girl{
    width:150px;
    position:fixed;
    bottom:0;
    left:-200px;
    transition:2s;
}
.move{ left:40%; }

/* PERSON */
.person{
    width:150px;
    position:fixed;
    bottom:0;
    right:-200px;
    transition:2s;
}
.enter{ right:30%; }

/* CAKE */
#cake{
    width:150px;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:none;
}

/* KNIFE */
#knife{
    width:80px;
    position:fixed;
    top:50%;
    left:70%;
    display:none;
}

/* BALLOONS */
.balloon{
    position:absolute;
    width:60px;
    bottom:-100px;
    animation:up 6s linear infinite;
}
@keyframes up{
    from{transform:translateY(0);}
    to{transform:translateY(-120vh);}
}

/* FIREWORK */
#fire{
    position:fixed;
    width:100%;
    height:100%;
    background:url("https://i.ibb.co/4pJ4JwZ/fireworks.gif") center/cover no-repeat;
    display:none;
}
</style>
</head>

<body>

<button id="btn" onclick="start()">🎁 Surprise</button>

<h1 id="name">Happy Birthday Sahitya 🎉</h1>

<img src="https://i.ibb.co/4d8QZ8W/girl.png" class="girl" id="girl">
<img src="https://i.ibb.co/zsKJ0y3/boy-cake.png" class="person" id="person">

<img src="https://i.ibb.co/tpjW68LS/cake-peace.png" id="cake">
<img src="https://i.ibb.co/gZcfN3Gq/knife.png" id="knife">

<div id="fire"></div>

<!-- balloons -->
<img src="https://i.ibb.co/3y0Wz6S/balloon1.png" class="balloon" style="left:10%;">
<img src="https://i.ibb.co/3y0Wz6S/balloon1.png" class="balloon" style="left:40%;animation-delay:2s;">
<img src="https://i.ibb.co/3y0Wz6S/balloon1.png" class="balloon" style="left:70%;animation-delay:4s;">

<script>
function start(){

document.getElementById("btn").style.display="none";

let girl=document.getElementById("girl");
let person=document.getElementById("person");

girl.classList.add("move");
person.classList.add("enter");

// show cake after give
setTimeout(()=>{
    document.getElementById("cake").style.display="block";
    person.style.display="none"; // hide cake person
},3000);

// knife
setTimeout(()=>{
    document.getElementById("knife").style.display="block";
},4000);

// cut
setTimeout(()=>{
    document.getElementById("knife").style.display="none";
},5500);

// show name + fireworks
setTimeout(()=>{
    document.getElementById("name").style.display="block";
    document.getElementById("fire").style.display="block";
},6000);

}
</script>

</body>
</html>
