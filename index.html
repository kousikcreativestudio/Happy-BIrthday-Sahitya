<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    height:100vh;
    overflow:hidden;
    background:url("https://i.ibb.co/JwMLHkGT/background.jpg") no-repeat center/cover;
    font-family:sans-serif;
}

/* MAIN CENTER AREA */
.scene{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* GIRL */
.girl{
    width:150px;
    position:absolute;
    left:-180px;
    top:50%;
    transform:translateY(-50%);
    transition:left 3s linear;
}

.walk{
    animation:walk 0.4s infinite alternate;
}
@keyframes walk{
    0%{transform:translateY(-50%) rotate(0deg);}
    100%{transform:translateY(-48%) rotate(2deg);}
}

.move{ left:120px; }

/* CAKE */
.cake{
    width:200px;
}

/* KNIFE */
.knife{
    width:80px;
    position:absolute;
    right:-120px;
    top:50%;
    transform:translateY(-50%);
    display:none;
}

/* FIREWORKS */
#fireworks{
    position:fixed;
    width:100%;
    height:100%;
    pointer-events:none;
}
.fire{
    position:absolute;
    width:180px;
    animation:boom 1.5s linear;
}
@keyframes boom{
    0%{transform:scale(0.5);opacity:1;}
    100%{transform:scale(2.5);opacity:0;}
}

/* BALLOONS */
#balloons{
    position:fixed;
    width:100%;
    height:100%;
}
.balloon{
    width:70px;
    position:absolute;
    bottom:-100px;
    animation:up 6s linear infinite;
}
@keyframes up{
    0%{transform:translateY(0);}
    100%{transform:translateY(-120vh);}
}

/* BLAST */
.blast{
    position:fixed;
    width:120px;
    transform:translate(-50%,-50%) scale(0.5);
    z-index:999;
}

/* NAME */
#name{
    position:fixed;
    top:5%;
    left:50%;
    transform:translateX(-50%);
    font-size:50px;
    font-family:"Brush Script MT",cursive;
    display:none;
    color:#ff4dff;
    text-shadow:0 0 10px currentColor,
                0 0 20px currentColor,
                0 0 30px currentColor;
}

/* BUTTONS */
.buttons{
    position:fixed;
    bottom:10px;
    width:100%;
    text-align:center;
}
.buttons img{
    width:100px;
    margin:5px;
    cursor:pointer;
}

</style>
</head>

<body>

<div id="fireworks"></div>
<div id="balloons"></div>

<h1 id="name">Sahitya</h1>

<div class="scene">

    <img id="girl" class="girl" src="https://i.ibb.co/rRx3bbfZ/girl.png">

    <img id="cake" class="cake" src="https://i.ibb.co/v6QqKVRT/cake.png">

    <img id="knife" class="knife" src="https://i.ibb.co/WNcGgx7j/knife.png">

</div>

<div class="buttons">
    <img src="https://i.ibb.co/fz19TN1B/entry.png" onclick="entry()">
    <img src="https://i.ibb.co/kV0X2gqY/cut-cake.png" onclick="cutCake()">
    <img src="https://i.ibb.co/TDdCnYTj/Surprise.png" onclick="goSurprise()">
</div>

<script>

/* ENTRY */
function entry(){
    let g=document.getElementById("girl");
    g.classList.add("walk");
    g.classList.add("move");

    setTimeout(()=>g.classList.remove("walk"),3000);
}

/* CUT */
function cutCake(){

    entry();

    let knife=document.getElementById("knife");

    setTimeout(()=>knife.style.display="block",1500);

    setTimeout(()=>{
        document.getElementById("name").style.display="block";
        startFireworks();
        startBalloons();
        startColors();
    },3000);
}

/* FIREWORKS */
function startFireworks(){
    let c=document.getElementById("fireworks");

    setInterval(()=>{
        let f=document.createElement("img");
        f.src="https://i.ibb.co/8QLGcnS/Pngtree-fireworks-for-new-years-celebration-20180243.png";
        f.className="fire";
        f.style.left=Math.random()*90+"%";
        f.style.top=Math.random()*70+"%";
        c.appendChild(f);
        setTimeout(()=>f.remove(),1500);
    },200);
}

/* BALLOONS */
function startBalloons(){
    let c=document.getElementById("balloons");

    setInterval(()=>{
        let b=document.createElement("img");
        b.src="https://i.ibb.co/8VzV5Rv/balloon.png";
        b.className="balloon";
        b.style.left=Math.random()*90+"%";

        b.onclick=(e)=>{
            blast(e.clientX,e.clientY);
            b.remove();
        };

        c.appendChild(b);
        setTimeout(()=>b.remove(),6000);
    },700);
}

/* BLAST FIXED */
function blast(x,y){
    let b=document.createElement("img");
    b.src="https://i.ibb.co/MDNbcwdM/blast-effect.png";
    b.className="blast";

    b.style.left=x+"px";
    b.style.top=y+"px";

    document.body.appendChild(b);

    setTimeout(()=>{
        b.style.transition="0.5s";
        b.style.transform="translate(-50%,-50%) scale(2)";
        b.style.opacity="0";
    },10);

    setTimeout(()=>b.remove(),600);
}

/* COLOR TEXT */
function startColors(){
    let name=document.getElementById("name");
    let colors=["#ff4dff","#00ffff","#ffff00","#ff0000","#00ff00"];
    let i=0;

    setInterval(()=>{
        name.style.color=colors[i];
        i=(i+1)%colors.length;
    },1000);
}

/* SURPRISE */
function goSurprise(){
    window.location.href="surprise.html";
}

</script>

</body>
</html>
