<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 Happy Birthday Sahitya 🎂</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* 🎨 Background Image (YOUR IMAGE FIXED) */
body {
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
    background: url('https://i.ibb.co/JwMLHkGT/background.jpg') no-repeat center center fixed;
    background-size: cover;
}

/* Overlay */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.5);
    top: 0;
}

/* Content */
.container {
    position: relative;
    z-index: 2;
    padding: 20px;
    min-height: 100vh;
}

/* Title */
h1 {
    font-size: 32px;
    margin-top: 20px;
}

/* Buttons */
.buttons {
    margin: 20px 0;
}

button {
    padding: 12px 20px;
    font-size: 15px;
    margin: 5px;
    border: none;
    border-radius: 10px;
    background: orange;
    color: white;
    cursor: pointer;
}

/* Cake */
.cake {
    width: 220px;
    max-width: 90%;
    margin-top: 20px;
    transition: transform 0.8s;
}

/* 🎂 Cake Animation */
.cut {
    transform: rotate(-10deg) scale(1.05);
}

/* 🎁 Surprise Section */
#surprise {
    display: none;
    margin-top: 30px;
    animation: fadeIn 1.5s ease;
}

/* YOUR SURPRISE IMAGE */
#surprise img {
    width: 90%;
    max-width: 300px;
    border-radius: 12px;
}

/* Animation */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

/* 📱 Mobile Fix */
@media (max-width: 600px) {
    h1 {
        font-size: 24px;
    }

    button {
        width: 45%;
        font-size: 13px;
    }

    .cake {
        width: 160px;
    }

    #surprise img {
        width: 95%;
    }
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">
    <h1>🎉 Happy Birthday Sahitya 🎂</h1>
    <p>💖 You are very special 💖</p>

    <div class="buttons">
        <button onclick="cutCake()">🍰 Cut Cake</button>
        <button onclick="showSurprise()">🎁 Surprise</button>
    </div>

    <!-- 🎂 Cake -->
    <img id="cake" class="cake" src="https://i.imgur.com/8QfQY6p.png">

    <!-- 🎁 Surprise -->
    <div id="surprise">
        <h2>💝 Surprise 💝</h2>

        <!-- ✅ YOUR IMAGE (FIXED) -->
        <img src="https://i.ibb.co/DPdz7CNw/photo.jpg" alt="Surprise">
    </div>
</div>

<script>
function cutCake() {
    const cake = document.getElementById("cake");
    cake.classList.add("cut");

    setTimeout(() => {
        alert("🎉 Cake Cut Successfully ❤️");
    }, 700);
}

function showSurprise() {
    document.getElementById("surprise").style.display = "block";
}
</script>

</body>
</html>
