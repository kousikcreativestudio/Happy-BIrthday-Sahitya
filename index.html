<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    overflow:hidden;
    background:url("https://i.ibb.co/JwMLHkGT/background.jpg") no-repeat center/cover;
    height:100vh;
}

/* GIRL */
.girl{
    width:170px;
    position:fixed;
    top:50%;
    left:-200px;
    transform:translateY(-50%);
    transition:2s;
}
.to-cake{ left:57%; }

/* CAKE */
.cake-box{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}
.half{
    width:160px;
    position:absolute;
    transition:1s;
}
.left{ clip-path: inset(0 50% 0 0); }
.right{ clip-path: inset(0 0 0 50%); }
.cut-left{ transform:translateX(-40px); }
.cut-right{ transform:translateX(40px); }

/* KNIFE */
.knife{
    width:90px;
    position:fixed;
    top:50%;
    left:70%;
    transform:translateY(-50%);
    display:none;
    transition:1s;
}
.hold{ left:62%; transform:translateY(-50%) rotate(-40deg); }
.cut{ transform:translateY(-20%) rotate(-40deg); }

/* 🎆 FIREWORKS */
#fireworks{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    pointer-events:none;
}
.fire{
    position:absolute;
    width:200px;
    animation:boom 1.5s linear;
}
@keyframes boom{
    0%{transform:scale(0.5);opacity:1;}
    100%{transform:scale(2.5);opacity:0;}
}

/* 🎈 BALLOONS */
#balloons{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
}
.balloon{
    width:60px;
    position:absolute;
    bottom:-100px;
    animation:floatUp 8s linear infinite;
    cursor:pointer;
}
@keyframes floatUp{
    0%{transform:translateY(0);}
    100%{transform:translateY(-120vh);}
}

/* 💥 BLAST */
.blast{
    position:absolute;
    width:80px;
    animation:blastAnim 0.6s linear;
}
@keyframes blastAnim{
    0%{transform:scale(0.5);opacity:1;}
    100%{transform:scale(1.8);opacity:0;}
}

/* ✨ NAME STYLE */
#name{
    position:fixed;
    top:6%;
    left:50%;
    transform:translateX(-50%);
    font-size:60px;
    font-family: "Brush Script MT", cursive;
    font-weight:bold;
    display:none;

    color:#ff4dff;
    text-shadow:0 0 10px currentColor,
                0 0 20px currentColor,
                0 0 30px currentColor;
}

/* BUTTONS */
.btns{
    position:fixed;
    bottom:10px;
    width:100%;
    text-align:center;
}
.img-btn{
    width:110px;
    margin:5px;
    cursor:pointer;
}

/* MOBILE */
@media(max-width:600px){
    .girl{width:120px;}
    .half{width:120px;}
    #name{font-size:40px;}
}
</style>
</head>

<body>

<div id="fireworks"></div>
<div id="balloons"></div>

<h1 id="name">Sahitya</h1>

<img id="girl" class="girl" src="https://i.ibb.co/rRx3bbfZ/girl.png">
<img id="knife" class="knife" src="https://i.ibb.co/WNcGgx7j/knife.png">

<div class="cake-box">
    <img id="cakeLeft" class="half left" src="https://i.ibb.co/v6QqKVRT/cake.png">
    <img id="cakeRight" class="half right" src="https://i.ibb.co/v6QqKVRT/cake.png">
</div>

<div class="btns">
    <img src="https://i.ibb.co/fz19TN1B/entry.png" onclick="showGirl()" class="img-btn">
    <img src="https://i.ibb.co/kV0X2gqY/cut-cake.png" onclick="cutCake()" class="img-btn">
</div>

<script>

/* GIRL MOVE */
function showGirl(){
    document.getElementById("girl").classList.add("to-cake");
}

/* CUT CAKE */
function cutCake(){

    let knife = document.getElementById("knife");

    document.getElementById("girl").classList.add("to-cake");

    setTimeout(()=>{ knife.style.display="block"; },1200);
    setTimeout(()=>{ knife.classList.add("hold"); },1800);
    setTimeout(()=>{ knife.classList.add("cut"); },2500);

    setTimeout(()=>{
        document.getElementById("cakeLeft").classList.add("cut-left");
        document.getElementById("cakeRight").classList.add("cut-right");
    },3200);

    setTimeout(()=>{
        document.getElementById("name").style.display="block";
        startColorChange();
        startFireworks();
        startBalloons();
    },3600);
}

/* 🎆 FIREWORKS */
function startFireworks(){
    let container = document.getElementById("fireworks");

    setInterval(()=>{
        let fire = document.createElement("img");
        fire.src="https://i.ibb.co/8QLGcnS/Pngtree-fireworks-for-new-years-celebration-20180243.png";
        fire.className="fire";

        fire.style.left = Math.random()*95 + "%";
        fire.style.top = Math.random()*70 + "%";

        container.appendChild(fire);
        setTimeout(()=>{ fire.remove(); },1500);
    },200);
}

/* 🎈 BALLOONS */
function startBalloons(){
    let container = document.getElementById("balloons");

    setInterval(()=>{
        let b = document.createElement("img");
        b.src="https://i.ibb.co/7QpKsCX/balloon.png";
        b.className="balloon";

        b.style.left = Math.random()*90 + "%";

        /* CLICK BLAST */
        b.onclick = function(e){
            createBlast(e.pageX, e.pageY);
            b.remove();
        };

        container.appendChild(b);

        setTimeout(()=>{ b.remove(); },8000);
    },800);
}

/* 💥 BLAST EFFECT */
function createBlast(x,y){
    let blast = document.createElement("img");
    blast.src="https://i.ibb.co/3W3hZgS/explosion.png";
    blast.className="blast";

    blast.style.left = x+"px";
    blast.style.top = y+"px";

    document.body.appendChild(blast);

    setTimeout(()=>{ blast.remove(); },600);
}

/* 🌈 COLOR CHANGE TEXT */
function startColorChange(){
    let name = document.getElementById("name");

    let colors = ["#ff4dff","#00ffff","#ffff00","#ff0000","#00ff00","#ff8800"];

    let i = 0;

    setInterval(()=>{
        name.style.color = colors[i];
        i = (i+1)%colors.length;
    },1000);
}

</script>

</body>
</html>
