<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    text-align:center;
    background:url("https://i.ibb.co/JwMLHkGT/background.jpg") no-repeat center/cover;
    height:100vh;
    overflow:hidden;
}

/* GIRL */
.girl{
    width:100px;
    position:fixed;
    bottom:80px;
    left:-120px;
    transition:2s;
}

/* walk to cake */
.walk{
    left:45%;
}

/* KNIFE */
.knife{
    width:60px;
    position:fixed;
    bottom:120px;
    left:55%;
    display:none;
    transition:1s;
}

/* knife in hand */
.hold{
    left:48%;
    bottom:110px;
    transform:rotate(-40deg);
}

/* CAKE CENTER */
.cake-box{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* CAKE SPLIT */
.half{
    width:180px;
    position:absolute;
    transition:1s;
}

.left{
    clip-path: inset(0 50% 0 0);
}

.right{
    clip-path: inset(0 0 0 50%);
}

.cut-left{
    transform:translateX(-30px);
}

.cut-right{
    transform:translateX(30px);
}

/* CAKE PIECE */
.piece{
    width:60px;
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:none;
}

/* BUTTONS */
.btns{
    position:fixed;
    bottom:10px;
    width:100%;
}

.img-btn{
    width:100px;
    margin:5px;
}

/* MOBILE */
@media(max-width:600px){
    .girl{width:80px;}
    .half{width:140px;}
}
</style>
</head>

<body>

<!-- GIRL -->
<img id="girl" class="girl" src="https://i.ibb.co/rRx3bbfZ/girl.png">

<!-- KNIFE -->
<img id="knife" class="knife" src="https://i.ibb.co/WNcGgx7j/knife.png">

<!-- CAKE -->
<div class="cake-box">
    <img id="cakeLeft" class="half left" src="https://i.ibb.co/v6QqKVRT/cake.png">
    <img id="cakeRight" class="half right" src="https://i.ibb.co/v6QqKVRT/cake.png">
</div>

<!-- SMALL PIECE -->
<img id="piece" class="piece" src="https://i.ibb.co/v6QqKVRT/cake.png">

<!-- BUTTONS -->
<div class="btns">

<img src="https://i.ibb.co/fz19TN1B/entry.png" onclick="showGirl()" class="img-btn">

<img src="https://i.ibb.co/kV0X2gqY/cut-cake.png" onclick="cutCake()" class="img-btn">

<img src="https://i.ibb.co/TDdCnYTj/Surprise.png" onclick="goSurprise()" class="img-btn">

</div>

<script>

/* ENTRY */
function showGirl(){
    document.getElementById("girl").classList.add("walk");
}

/* CUT CAKE FULL ACTION */
function cutCake(){

    let girl = document.getElementById("girl");
    let knife = document.getElementById("knife");

    // walk to cake
    girl.classList.add("walk");

    // show knife
    setTimeout(()=>{
        knife.style.display="block";
    },1500);

    // hold knife
    setTimeout(()=>{
        knife.classList.add("hold");
    },2000);

    // cut cake
    setTimeout(()=>{
        document.getElementById("cakeLeft").classList.add("cut-left");
        document.getElementById("cakeRight").classList.add("cut-right");
    },2800);

    // show cake piece
    setTimeout(()=>{
        document.getElementById("piece").style.display="block";
    },3500);

}

/* SURPRISE */
function goSurprise(){
    window.location.href="surprise.html";
}

</script>

</body>
</html>
