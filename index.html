<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    overflow:hidden;
    background:url("https://i.ibb.co/JwMLHkGT/background.jpg") no-repeat center/cover;
    height:100vh;
}

/* GIRL */
.girl{
    width:170px;
    position:fixed;
    top:50%;
    left:-200px;
    transform:translateY(-50%);
    transition:2s;
    z-index:5;
}
.to-cake{ left:57%; }

/* CAKE */
.cake-box{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    z-index:5;
}
.half{
    width:160px;
    position:absolute;
    transition:1s;
}
.left{ clip-path: inset(0 50% 0 0); }
.right{ clip-path: inset(0 0 0 50%); }
.cut-left{ transform:translateX(-40px); }
.cut-right{ transform:translateX(40px); }

/* KNIFE */
.knife{
    width:90px;
    position:fixed;
    top:55%;
    left:58%;
    transform:translate(-50%, -50%) rotate(-20deg);
    display:none;
    z-index:6;
}

/* REAL CUT */
.cut-action{
    animation: knifeCut 0.5s ease forwards;
}

@keyframes knifeCut{
    0%   { transform:translate(-50%, -50%) rotate(-20deg); }
    50%  { transform:translate(-50%, -20%) rotate(10deg); }
    100% { transform:translate(-50%, -50%) rotate(-40deg); }
}

/* HIT EFFECT */
.hit-effect{
    animation:knifeHit 0.15s ease;
}
@keyframes knifeHit{
    0%{ transform:translate(-50%, -5%) rotate(-40deg); }
    50%{ transform:translate(-50%, 0%) rotate(-40deg); }
    100%{ transform:translate(-50%, -5%) rotate(-40deg); }
}

/* NAME */
#name{
    position:fixed;
    top:6%;
    left:50%;
    transform:translateX(-50%);
    font-size:100px;
    font-family:"Brush Script MT",cursive;
    display:none;
    z-index:20;
    color:#ff4dff;
    text-shadow:0 0 10px currentColor,
                0 0 20px currentColor,
                0 0 30px currentColor;
}

/* BUTTONS */
.btns{
    position:fixed;
    bottom:10px;
    width:100%;
    text-align:center;
    z-index:20;
}
.img-btn{
    width:110px;
    margin:5px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1 id="name">Sahitya</h1>

<img id="girl" class="girl" src="https://i.ibb.co/rRx3bbfZ/girl.png">
<img id="knife" class="knife" src="https://i.ibb.co/WNcGgx7j/knife.png">

<div class="cake-box">
    <img id="cakeLeft" class="half left" src="https://i.ibb.co/v6QqKVRT/cake.png">
    <img id="cakeRight" class="half right" src="https://i.ibb.co/v6QqKVRT/cake.png">
</div>

<div class="btns">
    <img src="https://i.ibb.co/fz19TN1B/entry.png" onclick="showGirl()" class="img-btn">
    <img src="https://i.ibb.co/kV0X2gqY/cut-cake.png" onclick="cutCake()" class="img-btn">
</div>

<script>

function showGirl(){
    document.getElementById("girl").classList.add("to-cake");
}

function cutCake(){

    let knife = document.getElementById("knife");
    let cakeLeft = document.getElementById("cakeLeft");
    let cakeRight = document.getElementById("cakeRight");

    document.getElementById("girl").classList.add("to-cake");

    // SHOW KNIFE
    setTimeout(()=>{
        knife.style.display = "block";
    },1000);

    // CUT ACTION
    setTimeout(()=>{
        knife.classList.add("cut-action");
    },1500);

    // HIT EFFECT
    setTimeout(()=>{
        knife.classList.add("hit-effect");
    },1700);

    // CAKE SPLIT
    setTimeout(()=>{
        cakeLeft.classList.add("cut-left");
        cakeRight.classList.add("cut-right");
    },1800);

    // HIDE KNIFE
    setTimeout(()=>{
        knife.style.display = "none";
    },2300);

    // SHOW NAME
    setTimeout(()=>{
        document.getElementById("name").style.display="block";
    },2500);
}

</script>

</body>
</html>
