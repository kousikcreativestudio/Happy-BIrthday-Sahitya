<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    overflow:hidden;
    background:url("https://i.ibb.co/JwMLHkGT/background.jpg") no-repeat center/cover;
    height:100vh;
}

/* NAME */
#name{
    position:fixed;
    top:20px;
    width:100%;
    text-align:center;
    font-size:40px;
    display:none;
    animation:color 1s infinite alternate;
    z-index:10;
}
@keyframes color{
    from{color:white;}
    to{color:yellow;}
}

/* BUTTON */
#btn{
    position:fixed;
    top:20px;
    left:20px;
    padding:10px 20px;
    font-size:18px;
    z-index:10;
}

/* GIRL */
.girl{
    width:170px;
    position:fixed;
    top:50%;
    left:-200px;
    transform:translateY(-50%);
    transition:2s;
    z-index:5;
}
.to-cake{ left:55%; }

/* BOY */
#boy{
    width:160px;
    position:fixed;
    bottom:0;
    right:-200px;
    transition:2s;
    z-index:5;
}

/* STAND BOY */
#standBoy{
    width:160px;
    position:fixed;
    bottom:0;
    right:20%;
    display:none;
    z-index:5;
}

/* CAKE */
.cake-box{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    display:none;
}
.half{
    width:160px;
    position:absolute;
    transition:1s;
}
.left{ clip-path: inset(0 50% 0 0); }
.right{ clip-path: inset(0 0 0 50%); }
.cut-left{ transform:translateX(-40px); }
.cut-right{ transform:translateX(40px); }

/* KNIFE */
.knife{
    width:90px;
    position:fixed;
    top:50%;
    left:70%;
    transform:translateY(-50%);
    display:none;
    transition:1s;
}
.hold{ left:60%; transform:translateY(-50%) rotate(-40deg); }
.cut{ transform:translateY(-20%) rotate(-40deg); }

/* FIREWORKS */
#fireworks{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    display:none;
    background:url("https://i.ibb.co/3mJ6Y8H/fireworks.gif") center/cover;
}

/* BALLOONS */
#balloons{
    position:fixed;
    bottom:-200px;
    left:50%;
    transform:translateX(-50%);
    width:200px;
    display:none;
    animation:up 5s linear infinite;
}
@keyframes up{
    from{bottom:-200px;}
    to{bottom:100%;}
}
</style>
</head>

<body>

<button id="btn" onclick="start()">🎉 Surprise</button>

<h1 id="name">Sahitya 🎂</h1>

<img id="girl" class="girl" src="https://i.ibb.co/6JPDVKXp/girl.png">

<img id="boy" src="https://i.ibb.co/6JPDVKXp/boy-with-cake.png">
<img id="standBoy" src="https://i.ibb.co/6JPDVKXp/boy-standing.png">

<div class="cake-box" id="cake">
    <img src="https://i.ibb.co/6JPDVKXp/cake.png" class="half left" id="left">
    <img src="https://i.ibb.co/6JPDVKXp/cake.png" class="half right" id="right">
</div>

<img id="knife" class="knife" src="https://i.ibb.co/6JPDVKXp/knife.png">

<div id="fireworks"></div>

<img id="balloons" src="https://i.ibb.co/6JPDVKXp/balloons.png">

<script>

function start(){

    document.getElementById("btn").style.display="none";
    document.getElementById("name").style.display="block";

    // girl move
    document.getElementById("girl").classList.add("to-cake");

    // boy enter
    setTimeout(()=>{
        document.getElementById("boy").style.right="35%";
    },1000);

    // switch boy
    setTimeout(()=>{
        document.getElementById("boy").style.display="none";
        document.getElementById("standBoy").style.display="block";
    },3500);

    // show cake
    setTimeout(()=>{
        document.getElementById("cake").style.display="block";
        document.getElementById("knife").style.display="block";
    },4000);

    // knife hold
    setTimeout(()=>{
        document.getElementById("knife").classList.add("hold");
    },5000);

    // cut cake
    setTimeout(()=>{
        document.getElementById("knife").classList.add("cut");
        document.getElementById("left").classList.add("cut-left");
        document.getElementById("right").classList.add("cut-right");
    },6000);

    // fireworks + balloons
    setTimeout(()=>{
        document.getElementById("fireworks").style.display="block";
        document.getElementById("balloons").style.display="block";
    },7000);
}

</script>

</body>
</html>
