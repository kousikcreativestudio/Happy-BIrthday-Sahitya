<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    background:url("https://i.ibb.co/JwMLHkGT/background.jpg") no-repeat center/cover;
    height:100vh;
    overflow:hidden;
}

/* GIRL */
.girl{
    width:160px;
    position:fixed;
    top:50%;
    left:-200px;
    transform:translateY(-50%);
    transition:2s;
}

/* MOVE TO CAKE SIDE */
.to-cake{
    left:57%;
}

/* CAKE CENTER */
.cake-box{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* CAKE SPLIT */
.half{
    width:150px;
    position:absolute;
    transition:1s;
}

.left{
    clip-path: inset(0 50% 0 0);
}

.right{
    clip-path: inset(0 0 0 50%);
}

.cut-left{
    transform:translateX(-30px);
}

.cut-right{
    transform:translateX(30px);
}

/* KNIFE */
.knife{
    width:80px;
    position:fixed;
    top:50%;
    left:70%;
    transform:translateY(-50%);
    display:none;
    transition:1s;
}

.hold{
    left:62%;
    transform:translateY(-50%) rotate(-40deg);
}

.cut{
    transform:translateY(-20%) rotate(-40deg);
}

/* FIREWORKS */
#fireworks{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

.fire{
    position:absolute;
    width:80px;
    animation:boom 1s linear;
}

@keyframes boom{
    0%{transform:scale(0.5);opacity:1;}
    100%{transform:scale(1.5);opacity:0;}
}

/* BUTTONS */
.btns{
    position:fixed;
    bottom:10px;
    width:100%;
    text-align:center;
}

.img-btn{
    width:110px;
    margin:5px;
    cursor:pointer;
}

/* MOBILE */
@media(max-width:600px){
    .girl{width:120px;}
    .half{width:120px;}
    .img-btn{width:90px;}
}
</style>
</head>

<body>

<!-- FIREWORKS -->
<div id="fireworks"></div>

<!-- GIRL -->
<img id="girl" class="girl" src="https://i.ibb.co/rRx3bbfZ/girl.png">

<!-- KNIFE -->
<img id="knife" class="knife" src="https://i.ibb.co/WNcGgx7j/knife.png">

<!-- CAKE -->
<div class="cake-box">
    <img id="cakeLeft" class="half left" src="https://i.ibb.co/v6QqKVRT/cake.png">
    <img id="cakeRight" class="half right" src="https://i.ibb.co/v6QqKVRT/cake.png">
</div>

<!-- BUTTONS -->
<div class="btns">
    <img src="https://i.ibb.co/fz19TN1B/entry.png" onclick="showGirl()" class="img-btn">
    <img src="https://i.ibb.co/kV0X2gqY/cut-cake.png" onclick="cutCake()" class="img-btn">
    <img src="https://i.ibb.co/TDdCnYTj/Surprise.png" onclick="goSurprise()" class="img-btn">
</div>

<script>

/* ENTRY */
function showGirl(){
    document.getElementById("girl").classList.add("to-cake");
}

/* CUT CAKE */
function cutCake(){

    let girl = document.getElementById("girl");
    let knife = document.getElementById("knife");

    // move girl to cake side
    girl.classList.add("to-cake");

    // show knife
    setTimeout(()=>{
        knife.style.display="block";
    },1200);

    // hold knife
    setTimeout(()=>{
        knife.classList.add("hold");
    },1800);

    // cutting motion
    setTimeout(()=>{
        knife.classList.add("cut");
    },2500);

    // cake split
    setTimeout(()=>{
        document.getElementById("cakeLeft").classList.add("cut-left");
        document.getElementById("cakeRight").classList.add("cut-right");
    },3200);

    // start fireworks
    setTimeout(()=>{
        startFireworks();
    },3300);
}

/* FIREWORKS */
function startFireworks(){

    let container = document.getElementById("fireworks");

    setInterval(()=>{

        let fire = document.createElement("img");
        fire.src="https://i.ibb.co/8QLGcnS/Pngtree-fireworks-for-new-years-celebration-20180243.png";
        fire.className="fire";

        fire.style.left = Math.random()*90 + "%";
        fire.style.top = Math.random()*60 + "%";

        container.appendChild(fire);

        setTimeout(()=>{
            fire.remove();
        },1000);

    },300);
}

/* SURPRISE */
function goSurprise(){
    window.location.href="surprise.html";
}

</script>

</body>
</html>
