<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Birthday 🎉</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🎂 Happy Birthday Sahitya 🎉</h1>

<button onclick="openSurprise()">🎁 Open Surprise</button>

<div id="surpriseBox">

    <!-- 👧 Cartoon Girl -->
    <img src="https://i.imgur.com/3ZQ3Z6F.png" class="girl">

    <!-- 🎂 Cake -->
    <img id="cake" src="https://i.imgur.com/OdL0XPt.png">

    <!-- 🔪 Cut Button -->
    <button onclick="cutCake()" class="cutBtn">🔪 Cut Cake</button>

    <!-- 🎬 Slideshow -->
    <div id="videoSlideshow">
        <img class="vslide active" src="photo1.jpg">
        <img class="vslide" src="photo2.jpg">
        <img class="vslide" src="photo3.jpg">
    </div>

    <p id="surpriseText"></p>

</div>

<audio id="bgMusic" src="music.mp3" loop></audio>
<audio id="cutSound" src="https://www.soundjay.com/button/sounds/button-16.mp3"></audio>

<script src="script.js"></script>

</body>
</html>
