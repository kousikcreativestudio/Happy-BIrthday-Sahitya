<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Surprise</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
  background: linear-gradient(#ff0080, #ff4da6);
}

/* TOP NAME */
#name {
  position: absolute;
  top: 20px;
  width: 100%;
  text-align: center;
  font-size: 50px;
  font-weight: bold;
  font-family: "Brush Script MT", cursive;
  animation: colorChange 1s infinite;
  text-shadow: 0 0 10px white, 0 0 20px yellow;
}

@keyframes colorChange {
  0% {color: #ff0000;}
  25% {color: #00ff00;}
  50% {color: #00ccff;}
  75% {color: #ffff00;}
  100% {color: #ff00ff;}
}

/* CAKE */
#cake {
  position: absolute;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%);
  width: 250px;
}

/* BUTTONS */
.buttons {
  position: absolute;
  bottom: 20px;
  width: 100%;
  text-align: center;
}

.buttons button {
  padding: 10px 20px;
  margin: 5px;
  font-size: 16px;
}

/* BALLOONS */
.balloon {
  position: absolute;
  width: 80px;
  cursor: pointer;
  animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
  0% {transform: translateY(100vh);}
  100% {transform: translateY(-150px);}
}

/* BLAST EFFECT */
.blast {
  position: absolute;
  width: 100px;
  pointer-events: none;
  animation: blastAnim 0.5s forwards;
}

@keyframes blastAnim {
  0% {transform: scale(0.5); opacity:1;}
  100% {transform: scale(1.5); opacity:0;}
}

/* FIREWORK CANVAS */
canvas {
  position: absolute;
  top: 0;
  left: 0;
}
</style>
</head>

<body>

<div id="name">Sahitya</div>

<img id="cake" src="https://i.ibb.co/7y3Q3hF/cake.png">

<canvas id="fireworks"></canvas>

<div class="buttons">
  <button onclick="entry()">Entry</button>
  <button onclick="cutCake()">Cut Cake</button>
  <button onclick="surprise()">Surprise</button>
</div>

<script>
/* ---------------- FIREWORK ---------------- */
const canvas = document.getElementById("fireworks");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function createFirework(x, y) {
  for (let i = 0; i < 60; i++) { // bigger fireworks
    particles.push({
      x, y,
      dx: (Math.random() - 0.5) * 8,
      dy: (Math.random() - 0.5) * 8,
      life: 100
    });
  }
}

function animateFirework() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach((p, i) => {
    p.x += p.dx;
    p.y += p.dy;
    p.life--;

    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
    ctx.fillStyle = "white";
    ctx.fill();

    if (p.life <= 0) particles.splice(i,1);
  });
  requestAnimationFrame(animateFirework);
}
animateFirework();

/* ---------------- BUTTON ACTIONS ---------------- */
function entry() {
  alert("Entry Started 🎉");
}

function cutCake() {
  createFirework(window.innerWidth/2, 200);

  setTimeout(() => {
    createFirework(window.innerWidth/2, 150);
  }, 500);
}

function surprise() {
  spawnBalloons();
}

/* ---------------- BALLOONS ---------------- */
function spawnBalloons() {
  for (let i = 0; i < 5; i++) {
    let b = document.createElement("img");
    b.src = "https://i.ibb.co/8VzV5Rv/balloon.png";
    b.className = "balloon";
    b.style.left = Math.random()*window.innerWidth + "px";

    b.onclick = function(e) {
      blast(e.clientX, e.clientY);
      b.remove();
    };

    document.body.appendChild(b);
  }
}

/* ---------------- BLAST ---------------- */
function blast(x, y) {
  let blast = document.createElement("img");
  blast.src = "https://i.ibb.co/MDNbcwdM/blast-effect.png";
  blast.className = "blast";
  blast.style.left = (x-50) + "px";
  blast.style.top = (y-50) + "px";

  document.body.appendChild(blast);

  setTimeout(() => {
    blast.remove();
  }, 500);
}
</script>

</body>
</html>
