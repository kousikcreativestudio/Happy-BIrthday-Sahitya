<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  overflow: hidden;
  text-align: center;
  background: linear-gradient(135deg, #ff0066, #ff6699);
  color: white;
}

/* 🎈 Balloons */
.balloon {
  position: absolute;
  width: 60px;
  animation: float 8s infinite ease-in;
}

@keyframes float {
  0% { transform: translateY(100vh); }
  100% { transform: translateY(-120vh); }
}

/* 🎁 Button */
#surpriseBtn {
  position: absolute;
  top: 20px;
  left: 20px;
  padding: 12px 20px;
  background: #ff4da6;
  border: none;
  color: white;
  font-size: 18px;
  border-radius: 10px;
  cursor: pointer;
}

/* 🎂 Cake */
#cake {
  display: none;
  font-size: 40px;
  margin-top: 100px;
}

/* 🧍 Person */
#person {
  display: block;
  font-size: 60px;
  margin-top: 100px;
}

/* 🎉 Name animation */
#name {
  font-size: 50px;
  margin-top: 20px;
  font-weight: bold;
  animation: colorChange 2s infinite;
}

@keyframes colorChange {
  0% { color: yellow; }
  25% { color: cyan; }
  50% { color: lime; }
  75% { color: orange; }
  100% { color: pink; }
}
</style>
</head>

<body>

<!-- 🎁 Surprise Button -->
<button id="surpriseBtn">🎁 Surprise</button>

<!-- 🎈 Balloons -->
<img src="https://i.imgur.com/7QpKQ1F.png" class="balloon" style="left:10%;">
<img src="https://i.imgur.com/7QpKQ1F.png" class="balloon" style="left:30%;">
<img src="https://i.imgur.com/7QpKQ1F.png" class="balloon" style="left:50%;">
<img src="https://i.imgur.com/7QpKQ1F.png" class="balloon" style="left:70%;">
<img src="https://i.imgur.com/7QpKQ1F.png" class="balloon" style="left:90%;">

<!-- 🧍 Person -->
<div id="person">🧍</div>

<!-- 🎂 Cake -->
<div id="cake">🎂</div>

<!-- 🎉 Name -->
<div id="name">Sahitya</div>

<script>
document.getElementById("surpriseBtn").onclick = function() {

  // Step 1: Hide person
  document.getElementById("person").style.display = "none";

  // Step 2: Show cake
  document.getElementById("cake").style.display = "block";

  // Step 3: After 3 sec → hide cake → show person standing
  setTimeout(() => {
    document.getElementById("cake").style.display = "none";
    document.getElementById("person").style.display = "block";
  }, 3000);
};
</script>

</body>
</html>
