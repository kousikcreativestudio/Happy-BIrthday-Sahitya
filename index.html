<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Sahitya 🎂</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  text-align: center;
  color: white;
  background: linear-gradient(45deg, #ff00cc, #3333ff);
  overflow: hidden;
}

/* Title */
h1 {
  margin-top: 20px;
}

/* Buttons */
button {
  padding: 12px 25px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  background: orange;
  color: white;
  font-size: 18px;
  cursor: pointer;
}

/* Cake */
#cake {
  width: 200px;
  transition: 0.5s;
}

/* Hidden message */
#msg {
  display: none;
  font-size: 22px;
  margin-top: 20px;
}

/* Fireworks */
.firework {
  position: absolute;
  width: 5px;
  height: 5px;
  background: yellow;
  border-radius: 50%;
  animation: explode 1s linear forwards;
}

@keyframes explode {
  to {
    transform: translate(var(--x), var(--y));
    opacity: 0;
  }
}
</style>
</head>

<body>

<h1>🎉 Happy Birthday Sahitya 🎂</h1>

<button onclick="cutCake()">🎂 Cut Cake</button>
<button onclick="openSurprise()">🎁 Surprise</button>

<br><br>

<img id="cake" src="https://i.imgur.com/6R7bKQK.png">

<div id="msg">💖 You are very special 💖</div>

<audio id="music" src="https://www2.cs.uic.edu/~i101/SoundFiles/HappyBirthday.mid"></audio>

<script>

// Cake Cutting
function cutCake() {
  document.getElementById("cake").src =
  "https://i.imgur.com/Z6XbK0K.png"; // cut cake image

  document.getElementById("msg").style.display = "block";

  document.getElementById("music").play();

  fireworks();
}

// Fireworks
function fireworks() {
  for (let i = 0; i < 80; i++) {
    let f = document.createElement("div");
    f.className = "firework";

    f.style.left = Math.random()*window.innerWidth + "px";
    f.style.top = Math.random()*window.innerHeight + "px";

    f.style.setProperty('--x', (Math.random()*200-100)+"px");
    f.style.setProperty('--y', (Math.random()*200-100)+"px");

    document.body.appendChild(f);

    setTimeout(()=>f.remove(),1000);
  }
}

// Surprise → NEW PAGE
function openSurprise() {
  window.open("surprise.html", "_blank");
}

// Mobile touch effect
document.addEventListener("touchstart", function(e) {
  let dot = document.createElement("div");
  dot.className = "firework";

  dot.style.left = e.touches[0].clientX + "px";
  dot.style.top = e.touches[0].clientY + "px";

  document.body.appendChild(dot);

  setTimeout(()=>dot.remove(),1000);
});

</script>

</body>
</html>
