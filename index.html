<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Surprise</title>

<style>
body{
  margin:0;
  background:#ffb6c1;
  overflow:hidden;
  text-align:center;
  font-family:sans-serif;
}

/* NAME ANIMATION */
#name{
  font-size:50px;
  margin-top:20px;
  animation:colorChange 2s infinite;
}
@keyframes colorChange{
  0%{color:red;}
  25%{color:blue;}
  50%{color:green;}
  75%{color:purple;}
  100%{color:orange;}
}

/* BUTTON */
#startBtn{
  padding:15px 30px;
  font-size:20px;
  margin-top:20px;
  cursor:pointer;
}

/* IMAGES */
img{
  position:absolute;
}

/* PERSON WALKING */
#person1{
  left:-200px;
  bottom:50px;
  width:200px;
}

/* PERSON STANDING */
#person2{
  display:none;
  left:50%;
  transform:translateX(-50%);
  bottom:50px;
  width:200px;
}

/* GIRL */
#girl{
  right:50px;
  bottom:50px;
  width:200px;
}

/* CAKE */
#cake{
  display:none;
  left:50%;
  transform:translateX(-50%);
  bottom:100px;
  width:150px;
}

/* KNIFE */
#knife{
  display:none;
  left:55%;
  bottom:120px;
  width:80px;
}

/* CAKE PIECE */
#piece{
  display:none;
  left:60%;
  bottom:120px;
  width:80px;
}

/* BALLOONS */
.balloon{
  width:50px;
  bottom:-100px;
  animation:float 6s linear infinite;
}
@keyframes float{
  from{transform:translateY(0);}
  to{transform:translateY(-800px);}
}

/* FIREWORK */
.fire{
  position:absolute;
  width:20px;
  height:20px;
  background:yellow;
  border-radius:50%;
  display:none;
  animation:boom 1s ease-out forwards;
}
@keyframes boom{
  from{transform:scale(1); opacity:1;}
  to{transform:scale(5); opacity:0;}
}
</style>
</head>

<body>

<h1 id="name">Sahitya</h1>

<button id="startBtn" onclick="start()">🎉 Surprise 🎉</button>

<!-- IMAGES -->
<img id="person1" src="https://i.ibb.co/YMzgYgD/boy-with-cake.png">
<img id="person2" src="https://i.ibb.co/rGZJBjv2/boy-standing.png">
<img id="girl" src="https://i.ibb.co/YOUR-GIRL-IMAGE.png">

<img id="cake" src="https://i.ibb.co/YOUR-CAKE.png">
<img id="knife" src="https://i.ibb.co/YOUR-KNIFE.png">
<img id="piece" src="https://i.ibb.co/tpjW68LS/cake-peace.png">

<!-- BALLOONS -->
<img class="balloon" src="https://i.ibb.co/YOUR-BALLOON.png" style="left:10%;">
<img class="balloon" src="https://i.ibb.co/YOUR-BALLOON.png" style="left:40%;">
<img class="balloon" src="https://i.ibb.co/YOUR-BALLOON.png" style="left:70%;">

<!-- FIREWORKS -->
<div class="fire" id="f1" style="top:20%; left:30%;"></div>
<div class="fire" id="f2" style="top:30%; left:60%;"></div>

<script>

function start(){
  document.getElementById("startBtn").style.display="none";

  let p1 = document.getElementById("person1");

  let x = -200;

  let walk = setInterval(()=>{
    x+=5;
    p1.style.left = x + "px";

    if(x > window.innerWidth/2 - 100){
      clearInterval(walk);

      // SWITCH PERSON
      p1.style.display="none";
      document.getElementById("person2").style.display="block";

      // SHOW CAKE
      setTimeout(()=>{
        document.getElementById("cake").style.display="block";
      },500);

      // SHOW KNIFE
      setTimeout(()=>{
        document.getElementById("knife").style.display="block";
      },1500);

      // CUT CAKE → SHOW FIREWORK
      setTimeout(()=>{
        document.getElementById("knife").style.display="none";
        document.getElementById("f1").style.display="block";
        document.getElementById("f2").style.display="block";
      },2500);

      // SHOW PIECE
      setTimeout(()=>{
        document.getElementById("piece").style.display="block";
      },3000);

      // GIVE PIECE
      setTimeout(()=>{
        document.getElementById("piece").style.left="45%";
      },3500);

      // HIDE PIECE
      setTimeout(()=>{
        document.getElementById("piece").style.display="none";
      },4500);

    }
  },20);
}

</script>

</body>
</html>
